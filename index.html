      // Timings
      const [wakeTime, setWakeTime]     = useState(window.storage.get('settings:wake_time')     || '07:00');
      const [briefTime, setBriefTime]   = useState(window.storage.get('settings:briefing_time') || '08:00');
      const [digestTime, setDigestTime] = useState(window.storage.get('settings:digest_time')   || '21:00');

      // Appearance
      const [themeId, setThemeId] = useState(window.storage.get('settings:theme') || 'indigo');

      // Behavior
      const [verbosity, setVerbosity] = useState(window.storage.get('settings:verbosity')  || 'normal');
      const [nudgeFreq, setNudgeFreq] = useState(window.storage.get('settings:nudge_freq') || 'normal');

      // Alert defaults
      const ALL_DAYS = [90, 60, 30, 14, 7, 3, 1];
      const [alertDays, setAlertDays] = useState(window.storage.get('settings:default_alert_days') || [90,60,30,14,7,3,1]);
      const toggleDay = d => setAlertDays(p => p.includes(d) ? p.filter(x => x !== d) : [...p, d].sort((a,b) => b-a));

      // Family
      const [members, setMembers] = useState(() => DS.family.list());
      const [famForm, setFamForm] = useState({ name: '', relationship: 'partner' });
      const RELS = ['partner','spouse','child','parent','sibling','other'];

      const addMember = () => {
        if (!famForm.name.trim()) return;
        DS.family.create({ name: famForm.name.trim(), relationship: famForm.relationship, role: 'dependent' });
        setMembers(DS.family.list());
        setFamForm({ name: '', relationship: 'partner' });
      };
      const deleteMember = id => {
        if (!confirm('Remove this family member?')) return;
        DS.family.delete(id);
        setMembers(DS.family.list());
      };

      const saveAll = () => {
        window.storage.set('settings:api_key',            apiKey.trim());
        window.storage.set('settings:endpoint_url',       endpointUrl.trim());
        window.storage.set('settings:model',              modelName.trim());
        window.storage.set('settings:user_name',          name.trim());
        window.storage.set('settings:wake_time',          wakeTime);
        window.storage.set('settings:briefing_time',      briefTime);
        window.storage.set('settings:digest_time',        digestTime);
        window.storage.set('settings:verbosity',          verbosity);
        window.storage.set('settings:nudge_freq',         nudgeFreq);
        window.storage.set('settings:default_alert_days', alertDays);
        window.storage.set('settings:theme',              themeId);
        window.storage.set('settings:onboarded',          true);
        setSaved(true); setTimeout(() => setSaved(false), 2000);
      };

      const exportData = () => {
        const allData = {};
        window.storage.keys().forEach(k => { allData[k] = window.storage.get(k); });
        const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = `andy-backup-${DS.todayISO()}.json`; a.click();
        URL.revokeObjectURL(url);
      };
      const importData = () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = '.json';
        input.onchange = e => {
          const file = e.target.files[0]; if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            try {
              const data = JSON.parse(ev.target.result);
              if (!confirm('This will replace ALL current data. Continue?')) return;
              window.storage.clear();
              Object.entries(data).forEach(([k,v]) => window.storage.set(k, v));
              window.location.reload();
            } catch (_) { alert('Invalid backup file.'); }

          reader.readAsText(file);
        };
        input.click();
      };

      const TABS = [

            {tab === 'appearance' && (

                <h3 className="font-semibold text-gray-800">Appearance</h3>
                <div>

                <SaveBtn />

                      <div key={m.id} className="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-3 bg-white">
                        <div>
                          <div className="text-sm font-medium text-gray-800">{m.name}</div>
                          <div className="text-xs text-gray-400 capitalize">{m.relationship}</div>
                        </div>
                        <button onClick={() => deleteMember(m.id)} className="text-gray-300 hover:text-red-400 text-xs transition-colors">Remove</button>

                  <p className="text-sm text-gray-400">No family members added yet.</p>

                <div className="flex gap-2">
                  <input className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" placeholder="Name" value={famForm.name} onChange={e => setFamForm(p => ({...p,name:e.target.value}))} onKeyDown={e => e.key==='Enter' && addMember()} />
                  <select className="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" value={famForm.relationship} onChange={e => setFamForm(p => ({...p,relationship:e.target.value}))}>

    // ─── Mind ─────────────────────────────────────────────────────────────────────

    const EMOTION_META = {
      fear:     { bg: '#fecaca', text: '#991b1b', cloud: '#ef4444', label: 'Fear'     },
      greed:    { bg: '#fed7aa', text: '#9a3412', cloud: '#f97316', label: 'Greed'    },

      anxiety:  { bg: '#fde68a', text: '#92400e', cloud: '#f59e0b', label: 'Anxiety'  },
      love:     { bg: '#fce7f3', text: '#9d174d', cloud: '#ec4899', label: 'Love'     },
      anger:    { bg: '#fca5a5', text: '#7f1d1d', cloud: '#dc2626', label: 'Anger'    },
      sad:      { bg: '#bfdbfe', text: '#1e3a5f', cloud: '#3b82f6', label: 'Sad'      },
      negative: { bg: '#fca5a5', text: '#7f1d1d', cloud: '#f87171', label: 'Negative' },
      neutral:  { bg: '#f1f5f9', text: '#475569', cloud: '#94a3b8', label: 'Neutral'  },
    };

    const MIND_STOP = new Set([
      'this','that','with','have','from','they','will','been','were','what','when',
      'your','there','their','about','which','would','could','should','then','than',
      'into','some','over','also','more','very','just','like','well','even','only',
      'such','most','other','much','before','after','again','same','each','both',
      'where','here','come','came','does','didnt','dont','cant','wont','isnt',
    ]);

    function ThoughtCard({ thought, isAnalyzing, onDelete, onRetry }) {
      const timeAgo = iso => {
        const m = Math.floor((Date.now() - new Date(iso)) / 60000);
        if (m < 1)  return 'just now';
        if (m < 60) return `${m}m ago`;
        const h = Math.floor(m / 60);
        if (h < 24) return `${h}h ago`;
        return `${Math.floor(h / 24)}d ago`;
      };
      const hasFailed = thought.analyzeError && !isAnalyzing;
      return (
        <div className="group rounded-xl border border-gray-100 bg-white px-4 py-3 hover:shadow-sm transition-shadow">
          <div className="flex items-start gap-2">
            <div className="flex-1 min-w-0">
              <p className="text-sm text-gray-800 leading-relaxed">{thought.text}</p>
              <div className="flex items-center flex-wrap gap-2 mt-2">
                <span className="text-xs text-gray-400">{timeAgo(thought.timestamp)}</span>
                {isAnalyzing && <span className="text-xs text-indigo-400 animate-pulse">Analysing…</span>}
                {hasFailed && (
                  <span className="text-xs text-amber-500 flex items-center gap-1">
                    ⚠ {thought.analyzeError}
                    <button onClick={onRetry} className="underline hover:text-amber-700 ml-1">Retry</button>
                  </span>
                )}
                {thought.analyzed && !isAnalyzing && !hasFailed && thought.emotions.slice(0, 3).map((e, i) => {
                  const em = EMOTION_META[e.type] || EMOTION_META.neutral;
                  return (
                    <span key={i} style={{ backgroundColor: em.bg, color: em.text }}
                      className="text-xs px-2 py-0.5 rounded-full capitalize font-medium">
                      {em.label}
                    </span>
                  );
                })}
              </div>
            </div>
            <button onClick={onDelete}
              className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 text-lg leading-none transition-opacity mt-0.5">
              ×
            </button>
          </div>
        </div>
      );
    }

    function ThoughtCloud({ thoughts }) {
      const wordMap = {};
      thoughts.forEach(t => {
        const words = t.text.toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/)
          .filter(w => w.length > 3 && !MIND_STOP.has(w));
        words.forEach(w => {
          if (!wordMap[w]) wordMap[w] = { count: 0, emotion: 'neutral' };
          wordMap[w].count++;
          if (t.dominant && t.dominant !== 'neutral') wordMap[w].emotion = t.dominant;
        });
      });
      const words = Object.entries(wordMap)
        .sort((a, b) => b[1].count - a[1].count)
        .slice(0, 60)
        .map(([word, { count, emotion }], i) => ({
          word, count, emotion,
          size: Math.max(13, Math.min(38, 13 + count * 5)),
          rotate: (i % 7 - 3) * 7,
        }));

      if (!words.length) return <p className="text-center text-sm text-gray-400 py-6">Log more thoughts to build your cloud.</p>;

      // Emotion breakdown
      const totals = {};
      thoughts.filter(t => t.analyzed).forEach(t => { totals[t.dominant] = (totals[t.dominant] || 0) + 1; });
      const total = Object.values(totals).reduce((a, b) => a + b, 0);
      const breakdown = Object.entries(totals).sort((a, b) => b[1] - a[1]);

      return (
        <div>
          <div className="flex flex-wrap justify-center items-center gap-x-4 gap-y-2 py-6 px-4 min-h-40 rounded-2xl bg-gradient-to-br from-gray-50 to-white border border-gray-100">
            {words.map((w, i) => (
              <span key={i} style={{
                fontSize: `${w.size}px`,
                color: EMOTION_META[w.emotion]?.cloud || '#94a3b8',
                transform: `rotate(${w.rotate}deg)`,
                display: 'inline-block',
                fontWeight: w.count > 2 ? 600 : 400,
                opacity: 0.7 + Math.min(w.count * 0.06, 0.3),
                lineHeight: 1.3,
                userSelect: 'none',
              }}>
                {w.word}
              </span>
            ))}
          </div>
          {breakdown.length > 0 && (
            <div className="mt-3 flex flex-wrap gap-3">
              {breakdown.map(([emotion, count]) => {
                const meta = EMOTION_META[emotion] || EMOTION_META.neutral;
                return (
                  <div key={emotion} className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: meta.cloud }} />
                    <span className="text-xs text-gray-600">{meta.label}</span>
                    <span className="text-xs text-gray-400">{Math.round(count / total * 100)}%</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function MindView({ tick }) {
      const [input, setInput]         = useState('');
      const [thoughts, setThoughts]   = useState(() => window.storage.get('mind:thoughts') || []);
      const [showCloud, setShowCloud] = useState(false);
      const [analyzing, setAnalyzing] = useState(null);

      const saveThoughts = list => { window.storage.set('mind:thoughts', list); };

      const analyzeThought = async (thought, list) => {
        if (!window.storage.get('settings:endpoint_url') && !window.storage.get('settings:api_key')) {
          const updated = list.map(t => t.id === thought.id
            ? { ...t, analyzed: false, analyzeError: 'No AI backend — add API key or SenseiAI endpoint in Settings' }
            : t
          );
          setThoughts(updated); saveThoughts(updated); return;
        }

        setAnalyzing(thought.id);
        let raw = '';
        try {
          raw = await CS.callLLM(
            `Classify the emotions expressed in the following thought. You MUST return ONLY a raw JSON object — no explanation, no markdown, no code fences.

Format: {"emotions":[{"type":"EMOTION","intensity":0.0}],"dominant":"EMOTION"}

Valid emotion types: fear, greed, pride, happy, positive, negative, anxiety, love, anger, sad, neutral

Examples:
Thought: "I am terrified of losing my job" → {"emotions":[{"type":"fear","intensity":0.9},{"type":"anxiety","intensity":0.7}],"dominant":"fear"}
Thought: "I feel so grateful today" → {"emotions":[{"type":"happy","intensity":0.8},{"type":"positive","intensity":0.7}],"dominant":"happy"}
Thought: "I want more money than everyone else" → {"emotions":[{"type":"greed","intensity":0.8}],"dominant":"greed"}

Now classify this thought:`,
            thought.text, 250
          );
          const cleaned = raw.replace(/```json\s*/gi,'').replace(/```/g,'').trim();
          const result  = JSON.parse(cleaned);
          if (!result.dominant || !Array.isArray(result.emotions)) throw new Error('Unexpected response format');
          const updated = list.map(t => t.id === thought.id
            ? { ...t, emotions: result.emotions, dominant: result.dominant, analyzed: true, analyzeError: null }
            : t
          );
          setThoughts(updated); saveThoughts(updated);
        } catch (err) {
          console.error('[Mind] analyzeThought failed:', err.message, '| raw response:', raw);
          const updated = list.map(t => t.id === thought.id
            ? { ...t, analyzed: false, analyzeError: err.message.length > 60 ? err.message.slice(0, 60) + '…' : err.message }
            : t
          );
          setThoughts(updated); saveThoughts(updated);
        }
        setAnalyzing(null);
      };

      const retryAnalysis = (thought) => {
        const reset = thoughts.map(t => t.id === thought.id ? { ...t, analyzeError: null } : t);
        setThoughts(reset); saveThoughts(reset);
        analyzeThought(thought, reset);
      };

      const submit = () => {
        if (!input.trim()) return;
        const thought = {
          id: `th_${Date.now()}`,
          text: input.trim(),
          timestamp: new Date().toISOString(),
          emotions: [], dominant: 'neutral', analyzed: false,
        };
        const updated = [thought, ...thoughts];
        setThoughts(updated);
        saveThoughts(updated);
        setInput('');
        analyzeThought(thought, updated);
      };

      const deletThought = id => {
        const updated = thoughts.filter(t => t.id !== id);
        setThoughts(updated);
        saveThoughts(updated);
      };

      return (
        <div className="flex flex-col h-full">
          <div className="px-6 pt-6 pb-4 border-b border-gray-100 flex items-start justify-between gap-2">
            <div>
              <h2 className="text-xl font-bold text-gray-900">Mind</h2>
              <p className="text-xs text-gray-400 mt-0.5">Capture thoughts · Understand patterns</p>
            </div>
            <div className="flex gap-2 flex-shrink-0">
              {thoughts.some(t => t.analyzeError) && (
                <button onClick={() => thoughts.filter(t => t.analyzeError).forEach(t => retryAnalysis(t))}
                  className="px-3 py-2 rounded-xl text-sm font-medium bg-amber-50 text-amber-600 hover:bg-amber-100 transition-colors">
                  ↺ Retry All
                </button>
              )}
              <button onClick={() => setShowCloud(c => !c)}
                className={`px-4 py-2 rounded-xl text-sm font-medium transition-colors ${
                  showCloud ? 'bg-indigo-600 text-white' : 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100'
                }`}>
                {showCloud ? 'Hide Cloud' : '☁️ Show Cloud'}
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto px-6 py-4 space-y-4">
            {/* Input */}
            <div className="flex gap-2 items-end">
              <textarea
                className="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-300"
                placeholder="What's on your mind right now?"
                rows={2}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } }}
              />
              <button onClick={submit} disabled={!input.trim()}
                className="px-4 py-3 bg-indigo-600 text-white rounded-xl text-sm font-medium disabled:opacity-40 hover:bg-indigo-700 transition-colors">
                Log
              </button>
            </div>

            {/* Cloud (on demand) */}
            {showCloud && (
              <div className="rounded-2xl border border-gray-100 bg-white p-4">
                <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Thought Cloud</p>
                <ThoughtCloud thoughts={thoughts} />
              </div>
            )}

            {/* Thought list */}
            <div className="space-y-2">
              {thoughts.map(t => (
                <ThoughtCard key={t.id} thought={t} isAnalyzing={analyzing === t.id}
                  onDelete={() => deletThought(t.id)}
                  onRetry={() => retryAnalysis(t)} />
              ))}
              {thoughts.length === 0 && (
                <div className="text-center py-16 text-gray-400 text-sm">
                  <div className="text-4xl mb-3">🧠</div>
                  <p className="font-medium text-gray-500">Your mind is clear.</p>
                  <p className="mt-1">Log a thought to begin tracking your mental patterns.</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Vision Board ─────────────────────────────────────────────────────────────
    const TEXT_COLORS = [
      { bg: '#fef9c3', border: '#fde047', label: 'Yellow' },
      { bg: '#fce7f3', border: '#f9a8d4', label: 'Pink' },
      { bg: '#dbeafe', border: '#93c5fd', label: 'Blue' },
      { bg: '#dcfce7', border: '#86efac', label: 'Green' },
      { bg: '#ede9fe', border: '#c4b5fd', label: 'Purple' },
      { bg: '#ffedd5', border: '#fdba74', label: 'Orange' },
      { bg: '#ffffff', border: '#d1d5db', label: 'White' },
    ];

    function VisionBoardView() {
      const [items, setItems]         = React.useState(() => {
        try { return JSON.parse(window.storage.get('vision:items') || '[]'); } catch { return []; }
      });
      const [drag, setDrag]           = React.useState(null);
      const [resize, setResize]       = React.useState(null);
      const [fileOver, setFileOver]   = React.useState(false);
      const [editingId, setEditingId] = React.useState(null);
      const [selected, setSelected]   = React.useState(null);
      const canvasRef      = React.useRef(null);
      // A detached input that is NEVER appended to any DOM node.
      // Browsers allow .click() on detached file inputs; the picker opens normally.
      // Because it has no parent, React (or anyone) never calls removeChild on it.
      const detachedInput  = React.useRef(null);
      const readFilesCbRef = React.useRef(null); // keeps readFiles fresh across renders

      if (!detachedInput.current) {
        const inp = document.createElement('input');
        inp.type     = 'file';
        inp.accept   = 'image/*';
        inp.multiple = true;
        inp.addEventListener('change', function () {
          // readFilesCbRef.current is updated every render — always the latest version
          if (readFilesCbRef.current) readFilesCbRef.current(inp.files, 60, 60);
          setTimeout(function () { try { inp.value = ''; } catch (_) {} }, 0);
        });
        detachedInput.current = inp;
      }

      // Auto-focus editing element without autoFocus prop
      React.useEffect(() => {
        if (!editingId) return;
        const t = setTimeout(() => {
          const el = canvasRef.current && canvasRef.current.querySelector('[data-edit-focus]');
          if (el) el.focus();
        }, 0);
        return () => clearTimeout(t);
      }, [editingId]);

      React.useEffect(() => {
        // Base64 photos can be several MB each — localStorage limit is ~5 MB total.
        // Try to save everything; if quota exceeded, save text cards only so they survive.
        try {
          window.storage.set('vision:items', JSON.stringify(items));
        } catch (_) {
          try {
            window.storage.set('vision:items', JSON.stringify(items.filter(i => i.type !== 'photo')));
          } catch (_2) { /* even text-only is too large — skip */ }
        }
      }, [items]);

      // ── Reposition drag ──────────────────────────────────────────────────────────
      function onItemMouseDown(e, id) {
        if (e.button !== 0 || editingId === id) return;
        e.preventDefault();
        e.stopPropagation();
        const item = items.find(i => i.id === id);
        setDrag({ id, sx: e.clientX, sy: e.clientY, ix: item.x, iy: item.y });
        setSelected(id);
      }

      function onResizeMouseDown(e, id) {
        e.preventDefault();
        e.stopPropagation();
        const item = items.find(i => i.id === id);
        setResize({ id, sx: e.clientX, sw: item.width || 220 });
      }

      React.useEffect(() => {
        function onMove(e) {
          if (drag) {
            const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
            setItems(prev => prev.map(i => i.id === drag.id ? { ...i, x: drag.ix + dx, y: drag.iy + dy } : i));
          }
          if (resize) {
            const nw = Math.max(100, resize.sw + (e.clientX - resize.sx));
            setItems(prev => prev.map(i => i.id === resize.id ? { ...i, width: nw } : i));
          }
        }
        function onUp() { setDrag(null); setResize(null); }
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
      }, [drag, resize]);

      // ── Read files — uses functional setItems updater so safe from any async context
      function readFiles(files, baseX, baseY) {
        Array.from(files).forEach((file, fi) => {
          if (!file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = ev => {
            setItems(prev => [...prev, {
              id: `img-${Date.now()}-${fi}`,
              type: 'photo',
              x: Math.max(0, baseX + fi * 24),
              y: Math.max(0, baseY + fi * 24),
              width: 220,
              content: ev.target.result,
              label: '',
              rotate: (Math.random() * 6 - 3).toFixed(1),
            }]);
          };
          reader.readAsDataURL(file);
        });
      }
      // Keep the ref current every render so the detached input's listener is always fresh
      readFilesCbRef.current = readFiles;

      function onDrop(e) {
        e.preventDefault();
        setFileOver(false);
        if (!canvasRef.current) return;
        const rect = canvasRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left  + canvasRef.current.scrollLeft - 110;
        const y = e.clientY - rect.top   + canvasRef.current.scrollTop  - 80;
        readFiles(e.dataTransfer.files, x, y);
      }

      function addText() {
        const id = `txt-${Date.now()}`;
        const ci = Math.floor(Math.random() * TEXT_COLORS.length);
        setItems(prev => [...prev, {
          id,
          type: 'text',
          x: 60 + Math.random() * 300,
          y: 60 + Math.random() * 200,
          width: 200,
          content: 'Double-click to edit',
          bg: TEXT_COLORS[ci].bg,
          border: TEXT_COLORS[ci].border,
          fontSize: 16,
          rotate: (Math.random() * 6 - 3).toFixed(1),
        }]);
        setEditingId(id);
        setSelected(id);
      }

      function deleteItem(id) {
        setItems(prev => prev.filter(i => i.id !== id));
        setSelected(s  => s  === id ? null : s);
        setEditingId(e => e  === id ? null : e);
      }

      function bringToFront(id) {
        setItems(prev => {
          const item = prev.find(i => i.id === id);
          if (!item) return prev;
          return [...prev.filter(i => i.id !== id), item];
        });
      }

      function cycleColor(id) {
        setItems(prev => prev.map(item => {
          if (item.id !== id || item.type !== 'text') return item;
          const cur  = TEXT_COLORS.findIndex(c => c.bg === item.bg);
          const next = TEXT_COLORS[(cur + 1) % TEXT_COLORS.length];
          return { ...item, bg: next.bg, border: next.border };
        }));
      }

      const sel = items.find(i => i.id === selected);

      return (
        <div className="flex flex-col h-full bg-slate-900 overflow-hidden">
          {/* Toolbar */}
          <div className="flex items-center gap-2 px-4 py-2.5 bg-slate-800 border-b border-slate-700 shrink-0 flex-wrap">
            <span className="text-white font-semibold text-sm mr-1">Vision Board</span>
            <button onClick={addText}
              className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition-colors">
              + Text
            </button>
            <button onClick={() => detachedInput.current && detachedInput.current.click()}
              className="bg-slate-600 hover:bg-slate-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition-colors">
              + Photo
            </button>
            {sel && (
              <>
                {sel.type === 'text' && (
                  <>
                    <button onClick={() => cycleColor(sel.id)}
                      className="w-6 h-6 rounded-full border-2 border-white/40 hover:border-white transition-colors"
                      style={{ background: sel.bg }} title="Cycle colour" />
                    <select value={sel.fontSize || 16}
                      onChange={e => setItems(prev => prev.map(i => i.id === sel.id ? { ...i, fontSize: +e.target.value } : i))}
                      className="bg-slate-700 text-white text-xs rounded-lg px-2 py-1.5 border border-slate-600">
                      {[12,14,16,20,24,32,40].map(s => <option key={s} value={s}>{s}px</option>)}
                    </select>
                  </>
                )}
                <button onClick={() => bringToFront(sel.id)}
                  className="bg-slate-600 hover:bg-slate-500 text-white text-xs px-3 py-1.5 rounded-lg transition-colors">
                  Bring forward
                </button>
                <button onClick={() => deleteItem(sel.id)}
                  className="bg-red-700 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg transition-colors">
                  Delete
                </button>
              </>
            )}
            <span className="ml-auto text-slate-400 text-xs">Drag photos onto the board or use + Photo</span>
          </div>

          {/* Canvas */}
          <div ref={canvasRef} className="flex-1 overflow-auto relative"
            style={{
              background: fileOver
                ? 'rgba(99,102,241,0.12)'
                : 'radial-gradient(ellipse at 20% 50%, #1e1b4b 0%, #0f172a 60%, #1a0a2e 100%)',
              cursor: drag ? 'grabbing' : 'default',
            }}
            onDragOver={e => { e.preventDefault(); setFileOver(true); }}
            onDragLeave={e => { if (!canvasRef.current.contains(e.relatedTarget)) setFileOver(false); }}
            onDrop={onDrop}
            onClick={() => { setSelected(null); setEditingId(null); }}
          >
            {items.length === 0 && (
              <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none select-none">
                <div className="text-6xl mb-4 opacity-20">🌟</div>
                <p className="text-slate-500 text-sm">Drag & drop photos, or use + Photo / + Text</p>
              </div>
            )}
            {fileOver && (
              <div className="absolute inset-4 border-2 border-dashed border-indigo-400 rounded-2xl pointer-events-none" />
            )}

            <div className="relative" style={{ minWidth: 1400, minHeight: 900 }}>
              {items.map(item => {
                const isSelected = selected  === item.id;
                const isEditing  = editingId === item.id;
                const rot = `rotate(${item.rotate || 0}deg)`;

                if (item.type === 'photo') {
                  return (
                    <div key={item.id}
                      style={{ position: 'absolute', left: item.x, top: item.y, width: item.width,
                        transform: rot, userSelect: 'none', zIndex: isSelected ? 100 : 1,
                        boxShadow: isSelected ? '0 0 0 3px #818cf8, 0 8px 32px rgba(0,0,0,0.6)' : '0 8px 32px rgba(0,0,0,0.5)',
                        cursor: drag?.id === item.id ? 'grabbing' : 'grab' }}
                      onMouseDown={e => { onItemMouseDown(e, item.id); bringToFront(item.id); }}
                      onDoubleClick={e => { e.stopPropagation(); setEditingId(item.id); setSelected(item.id); }}
                    >
                      <div className="bg-white p-2 pb-6 rounded shadow-md">
                        <img src={item.content} alt="" draggable={false}
                          style={{ width: '100%', display: 'block', borderRadius: 2 }} />
                        {/* Always render the caption div; swap to input only when editing */}
                        <div className="mt-1 min-h-[20px]" onClick={e => e.stopPropagation()}>
                          {isEditing
                            ? <input data-edit-focus
                                className="w-full text-center text-xs text-gray-600 bg-transparent border-b border-gray-300 outline-none"
                                value={item.label} placeholder="Add caption…"
                                onChange={e => setItems(prev => prev.map(i => i.id === item.id ? { ...i, label: e.target.value } : i))}
                                onBlur={() => setEditingId(null)}
                                onKeyDown={e => { if (e.key === 'Enter') setEditingId(null); }}
                              />
                            : <div className="text-center text-xs text-gray-500 italic">{item.label || ' '}</div>
                          }
                        </div>
                      </div>
                      <div style={{ position: 'absolute', right: -6, bottom: -6, width: 16, height: 16,
                          background: '#818cf8', borderRadius: '50%', cursor: 'nwse-resize', border: '2px solid white' }}
                        onMouseDown={e => { e.stopPropagation(); onResizeMouseDown(e, item.id); }} />
                    </div>
                  );
                }

                // Text sticky card
                return (
                  <div key={item.id}
                    style={{ position: 'absolute', left: item.x, top: item.y, width: item.width,
                      transform: rot, borderRadius: 8, padding: '12px 14px', minHeight: 80,
                      background: item.bg || '#fef9c3', border: `2px solid ${item.border || '#fde047'}`,
                      boxShadow: isSelected ? '0 0 0 3px #818cf8, 0 8px 24px rgba(0,0,0,0.5)' : '0 6px 20px rgba(0,0,0,0.4)',
                      cursor: isEditing ? 'text' : (drag?.id === item.id ? 'grabbing' : 'grab'),
                      userSelect: isEditing ? 'text' : 'none', zIndex: isSelected ? 100 : 1 }}
                    onMouseDown={e => { if (!isEditing) { onItemMouseDown(e, item.id); bringToFront(item.id); } }}
                    onDoubleClick={e => { e.stopPropagation(); setEditingId(item.id); setSelected(item.id); }}
                    onClick={e => e.stopPropagation()}
                  >
                    {isEditing
                      ? <textarea data-edit-focus
                          style={{ width: '100%', background: 'transparent', border: 'none', outline: 'none',
                            fontSize: item.fontSize || 16, color: '#1e1b4b', resize: 'vertical',
                            fontFamily: 'inherit', lineHeight: 1.5, minHeight: 56 }}
                          value={item.content}
                          onChange={e => setItems(prev => prev.map(i => i.id === item.id ? { ...i, content: e.target.value } : i))}
                          onBlur={() => setEditingId(null)}
                          onClick={e => e.stopPropagation()}
                        />
                      : <div style={{ fontSize: item.fontSize || 16, color: '#1e1b4b', lineHeight: 1.5,
                            whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                          {item.content}
                        </div>
                    }
                    <div style={{ position: 'absolute', right: -6, bottom: -6, width: 16, height: 16,
                        background: '#818cf8', borderRadius: '50%', cursor: 'nwse-resize', border: '2px solid white' }}
                      onMouseDown={e => { e.stopPropagation(); onResizeMouseDown(e, item.id); }} />
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ─── Sensei Agent ─────────────────────────────────────────────────────────────

    const SENSEI_TOOLS = {
      get_habits: () => DS.habits.list().map(h => ({
        name: h.name, frequency: h.frequency,
        currentStreak: h.currentStreak, longestStreak: h.longestStreak,
        adherence7d:  DS.habits.adherenceRate(h.id, 7),
        adherence30d: DS.habits.adherenceRate(h.id, 30),
        recentLog: (h.log || []).slice(-14).map(e => ({ date: e.date, done: e.done })),
      })),

      get_tasks: () => {
        const today = DS.todayISO();
        const open = DS.tasks.listOpen();
        const all  = DS.tasks.list ? DS.tasks.list() : open;
        return {
          open: open.map(t => ({ id: t.id, title: t.title, priority: t.priority, dueDate: t.dueDate, deferralCount: t.deferralCount || 0, category: t.category })),
          overdue: open.filter(t => t.dueDate && t.dueDate < today).map(t => ({ title: t.title, dueDate: t.dueDate, deferralCount: t.deferralCount || 0 })),
          chronicallyDeferred: DS.tasks.listChronicallyDeferred(2).map(t => ({ title: t.title, deferralCount: t.deferralCount, dueDate: t.dueDate })),
        };
      },

      get_deadlines: () => {
        const today = DS.todayISO();
        return DS.deadlines.list()
          .filter(d => d.status !== 'done')
          .map(d => ({ title: d.title, dueDate: d.dueDate, daysLeft: DS.daysUntil(d.dueDate), category: d.category, status: d.status }))
          .sort((a, b) => a.daysLeft - b.daysLeft);
      },

      get_mind_thoughts: () => {
        const raw = window.storage.get('mind:thoughts') || [];
        return raw.slice(-30).map(t => ({ text: t.text, emotion: t.emotion, timestamp: t.timestamp }));
      },

      get_execution_stats: () => {
        const open = DS.tasks.listOpen();
        const deferred = DS.tasks.listChronicallyDeferred(2);
        const today = DS.todayISO();
        const overdue = open.filter(t => t.dueDate && t.dueDate < today);
        const totalDeferred = open.reduce((s, t) => s + (t.deferralCount || 0), 0);
        return {
          openCount: open.length,
          overdueCount: overdue.length,
          chronicallyDeferredCount: deferred.length,
          avgDeferralsPerTask: open.length ? +(totalDeferred / open.length).toFixed(1) : 0,
          topDeferred: deferred.slice(0, 5).map(t => ({ title: t.title, deferralCount: t.deferralCount })),
        };
      },
    };

    const SENSEI_SYSTEM = `You are Sensei — an autonomous life coach and strategic planner inside Andy. You have access to the user's habits, tasks, deadlines, and logged mind thoughts.

You reason in a loop before answering. Each response must be exactly one JSON object:

{ "step": "think" | "tool" | "answer", "thought": "<your internal reasoning — always required>", "tool": "<tool name or null>", "args": null, "sections": null | [{ "icon": "<emoji>", "title": "<section title>", "content": "<plain text advice — no markdown>" }], "summary": null | "<1-2 sentence wrap-up>" }

Rules:
- Always start with a "think" step to plan your approach
- Use "tool" steps to pull specific data before drawing conclusions
- Each "tool" step: set tool to one of the available tool names, args to null
- "answer" step ends the loop — include sections and summary
- Be direct, warm, non-judgmental, specific — reference actual data you've seen
- No markdown inside content fields. Plain sentences only.
- Sections should only cover areas where you have real observations

Available tools: get_habits | get_tasks | get_deadlines | get_mind_thoughts | get_execution_stats`;

    async function runSenseiAgent(query, onStep) {
      const MAX_STEPS = 7;
      const history = [];

      const baseCtx = (() => {
        const ctx = CS.getFullContext();
        return { today: ctx.today, user: ctx.user.name, overdue: ctx.overdue.length, dueToday: ctx.dueToday.length };
      })();

      let userMsg = `User request: "${query}"\n\nBasic snapshot: ${JSON.stringify(baseCtx)}\n\nBegin your reasoning.`;

      for (let i = 0; i < MAX_STEPS; i++) {
        let raw;
        try {
          raw = await CS.callLLM(SENSEI_SYSTEM, userMsg, 900, history);
        } catch (err) {
          onStep({ step: 'error', thought: err.message });
          return;
        }

        // Strip fences
        const cleaned = raw.replace(/^```json\s*/im, '').replace(/^```\s*/im, '').replace(/\s*```$/im, '').trim();
        let parsed;
        try { parsed = JSON.parse(cleaned); } catch (_) {
          // Try to extract JSON object
          const m = cleaned.match(/\{[\s\S]*\}/);
          try { parsed = m ? JSON.parse(m[0]) : null; } catch (_) { parsed = null; }
        }

        if (!parsed) {
          onStep({ step: 'error', thought: 'Could not parse Sensei response. Check backend connection.' });
          return;
        }

        onStep(parsed);

        if (parsed.step === 'answer') return;

        // Build next message
        history.push({ role: 'assistant', content: raw });

        if (parsed.step === 'tool' && parsed.tool && SENSEI_TOOLS[parsed.tool]) {
          let result;
          try { result = SENSEI_TOOLS[parsed.tool](); } catch (e) { result = { error: e.message }; }
          userMsg = `Tool "${parsed.tool}" returned: ${JSON.stringify(result)}\n\nContinue your reasoning.`;
          history.push({ role: 'user', content: userMsg });
        } else {
          userMsg = 'Continue your reasoning.';
          history.push({ role: 'user', content: userMsg });
        }
      }
    }

    // Quick-mode prompts
    const SENSEI_MODES = [
      { id: 'daily',     icon: '🌅', label: 'Daily Review',     query: 'Do a full daily review. Check my habits, tasks due today, overdue items, and recent mind thoughts. Give me a practical plan for today.' },
      { id: 'week',      icon: '📆', label: 'Week Plan',         query: 'Plan my week. Analyse my deadlines, open tasks by priority, and habit momentum. Give me a clear focus and day-by-day guidance for the next 7 days.' },
      { id: 'execution', icon: '⚙️', label: 'Execution Review',  query: 'Review my execution patterns. Look at task completion, deferral habits, overdue items. Diagnose why I might be stuck and give specific suggestions.' },
      { id: 'mind',      icon: '🧘', label: 'Mind Coaching',     query: 'Analyse my logged thoughts from the Mind tab. Identify emotional patterns, recurring fears or themes, and help me think more clearly about what my mind is doing.' },
    ];

    function SenseiThoughtBubble({ step, idx }) {
      const [open, setOpen] = React.useState(false);
      if (step.step === 'answer') return null;
      const isError = step.step === 'error';
      const isTool  = step.step === 'tool';
      const label   = isError ? '⚠ Error' : isTool ? `🔧 ${step.tool}` : `💭 Reasoning`;
      return (
        <div className={`rounded-xl border text-xs cursor-pointer select-none transition-colors ${isError ? 'border-red-200 bg-red-50' : 'border-indigo-100 bg-indigo-50'}`}
          onClick={() => setOpen(o => !o)}>
          <div className="flex items-center gap-2 px-3 py-2">
            <span className={`font-semibold ${isError ? 'text-red-600' : 'text-indigo-500'}`}>{label}</span>
            <span className="text-gray-400 ml-auto">{open ? '▲' : '▼'}</span>
          </div>
          {open && <div className={`px-3 pb-3 leading-relaxed ${isError ? 'text-red-700' : 'text-indigo-800'}`}>{step.thought}</div>}
        </div>
      );
    }

    function SenseiAnswer({ sections, summary }) {
      if (!sections && !summary) return null;
      return (
        <div className="space-y-3">
          {summary && (
            <div className="bg-indigo-600 text-white rounded-2xl px-4 py-3 text-sm leading-relaxed">
              {summary}
            </div>
          )}
          {(sections || []).map((s, i) => (
            <div key={i} className="bg-white border border-gray-200 rounded-2xl px-4 py-3 space-y-1">
              <div className="flex items-center gap-2 mb-1">
                <span className="text-lg">{s.icon}</span>
                <span className="font-semibold text-gray-800 text-sm">{s.title}</span>
              </div>
              <p className="text-gray-600 text-sm leading-relaxed">{s.content}</p>
            </div>
          ))}
        </div>
      );
    }

    function SenseiView() {
      const [steps, setSteps]     = React.useState([]);
      const [running, setRunning] = React.useState(false);
      const [done, setDone]       = React.useState(false);
      const [input, setInput]     = React.useState('');
      const [answer, setAnswer]   = React.useState(null);
      const bottomRef             = React.useRef(null);

      const scrollToBottom = () => bottomRef.current?.scrollIntoView({ behavior: 'smooth' });

      const run = async (query) => {
        if (running || !query.trim()) return;
        setSteps([]);
        setAnswer(null);
        setDone(false);
        setRunning(true);
        setInput('');
        await runSenseiAgent(query.trim(), step => {
          setSteps(prev => [...prev, step]);
          if (step.step === 'answer') {
            setAnswer({ sections: step.sections, summary: step.summary });
            setDone(true);
          }
          setTimeout(scrollToBottom, 50);
        });
        setRunning(false);
      };

      const handleKey = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(input); } };

      const hasBackend = !!(window.storage.get('settings:endpoint_url') || window.storage.get('settings:api_key'));

      return (
        <div className="flex flex-col h-full bg-slate-50">
          {/* Header */}
          <div className="bg-indigo-950 px-6 py-5 shrink-0">
            <div className="flex items-center gap-3 mb-1">
              <img src="andy2.png" alt="Sensei" className="w-9 h-9 rounded-full object-cover ring-2 ring-indigo-700" />
              <div>
                <div className="text-white font-bold text-lg tracking-tight">Sensei</div>
                <div className="text-indigo-400 text-xs">Autonomous life coach · habit · planning · execution · mind</div>
              </div>
            </div>
          </div>

          {/* Quick modes */}
          <div className="px-4 py-3 flex gap-2 flex-wrap shrink-0 border-b border-gray-200 bg-white">
            {SENSEI_MODES.map(m => (
              <button key={m.id} onClick={() => run(m.query)} disabled={running}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-indigo-200 text-indigo-700 text-xs font-medium hover:bg-indigo-50 disabled:opacity-40 transition-colors bg-white">
                <span>{m.icon}</span><span>{m.label}</span>
              </button>
            ))}
          </div>

          {/* Body */}
          <div className="flex-1 overflow-y-auto px-4 py-4 space-y-3">
            {!hasBackend && steps.length === 0 && !running && (
              <div className="text-center py-16 text-gray-400 text-sm">
                <div className="text-4xl mb-3">🥋</div>
                <p className="font-medium text-gray-600 mb-1">Sensei needs a backend</p>
                <p>Configure SenseiAI or Claude in <span className="text-indigo-500 font-medium">Settings → Profile</span> first.</p>
              </div>
            )}

            {hasBackend && steps.length === 0 && !running && (
              <div className="text-center py-16 text-gray-400 text-sm">
                <div className="text-4xl mb-3">🥋</div>
                <p className="font-medium text-gray-600 mb-1">Ready when you are</p>
                <p>Pick a mode above or ask anything below.</p>
              </div>
            )}

            {/* Thinking steps */}
            {steps.filter(s => s.step !== 'answer').map((s, i) => (
              <SenseiThoughtBubble key={i} step={s} idx={i} />
            ))}

            {/* Running indicator */}
            {running && (
              <div className="flex items-center gap-2 text-indigo-500 text-xs px-1">
                <span className="animate-pulse">●</span>
                <span className="animate-pulse" style={{ animationDelay: '0.2s' }}>●</span>
                <span className="animate-pulse" style={{ animationDelay: '0.4s' }}>●</span>
                <span className="ml-1">Sensei is thinking…</span>
              </div>
            )}

            {/* Final answer */}
            {done && answer && <SenseiAnswer sections={answer.sections} summary={answer.summary} />}

            <div ref={bottomRef} />
          </div>

          {/* Input */}
          <div className="px-4 py-3 border-t border-gray-200 bg-white flex gap-2 items-center shrink-0">
            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={handleKey}
              placeholder="Ask Sensei anything…" disabled={running}
              className="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 disabled:bg-gray-50" />
            <button onClick={() => run(input)} disabled={running || !input.trim()}
              className="bg-indigo-950 hover:bg-indigo-800 disabled:opacity-40 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-colors shrink-0">
              Ask
            </button>
          </div>
        </div>
      );
    }

    // ─── Triggers ────────────────────────────────────────────────────────────────
    function TriggersView({ tick, onRefresh, onTriggerFired }) {
      const [filter, setFilter]         = useState('watching');
      const [showAdd, setShowAdd]       = useState(false);
      const [checking, setChecking]     = useState(null);
      const [expandedId, setExpandedId] = useState(null);
      const [contextCards, setContextCards] = useState({});
      const apiKey = window.storage.get('settings:api_key') || '';

      const EMPTY = { title:'', conditionType:'rate', threshold:'', checkFrequency:'daily', actionDeadlineDays:7, notes:'' };
      const [form, setForm] = useState(EMPTY);
      const f = v => setForm(p => ({ ...p, ...v }));

      const all   = DS.triggers.list().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const shown = filter === 'all' ? all : all.filter(t => t.status === filter);

      // Expire any overdue triggered alerts
      useEffect(() => {
        const today = DS.todayISO();
        DS.triggers.list()
          .filter(t => t.status === 'triggered' && t.actionDeadline && t.actionDeadline < today)
          .forEach(t => {
            DS.triggers.expire(t.id);
            DS.activity.log('trigger_expired', `Expired without action: "${t.title}"`, { id: t.id });
          });
      }, [tick]);

      const handleAdd = () => {
        if (!form.title.trim() || !form.threshold.toString().trim()) return;
        DS.triggers.create({ ...form, actionDeadlineDays: parseInt(form.actionDeadlineDays) || 7 });
        setForm(EMPTY); setShowAdd(false); onRefresh();
      };

      const handleCheck = async (trigger) => {
        if (!apiKey) return;
        setChecking(trigger.id);
        const now = new Date().toISOString();
        try {
          const result = await checkTrigger(trigger, apiKey);
          DS.triggers.update(trigger.id, { lastChecked: now, lastValue: result.currentValue, lastSource: result.source, lastError: null });
          DS.activity.log('trigger_checked', `"${trigger.title}": ${result.currentValue}`, { id: trigger.id, thresholdMet: result.thresholdMet });

          if (result.thresholdMet && trigger.status === 'watching') {
            const actionDeadline = addDays(DS.todayISO(), parseInt(trigger.actionDeadlineDays) || 7);
            DS.triggers.update(trigger.id, { status: 'triggered', triggeredAt: now, actionDeadline, triggerResult: result });
            DS.activity.log('trigger_fired', `FIRED: "${trigger.title}" at ${result.currentValue}`, { id: trigger.id });
            onTriggerFired({ ...trigger, status:'triggered', actionDeadline, triggerResult: result });
          }
        } catch (err) {
          DS.triggers.update(trigger.id, { lastChecked: now, lastError: err.message });
        }
        setChecking(null);
        onRefresh();
      };

      const loadContext = async (trigger) => {
        if ((!window.storage.get('settings:endpoint_url') && !window.storage.get('settings:api_key')) || contextCards[trigger.id]) return;
        setContextCards(p => ({ ...p, [trigger.id]: { text: null, loading: true } }));
        try {
          const text = await generateTriggerContext(trigger, trigger.triggerResult || {});
          setContextCards(p => ({ ...p, [trigger.id]: { text, loading: false } }));
        } catch {
          setContextCards(p => ({ ...p, [trigger.id]: { text: 'Unable to generate context.', loading: false } }));
        }
      };

      const handleExpand = (trigger) => {
        const next = expandedId === trigger.id ? null : trigger.id;
        setExpandedId(next);
        if (next && trigger.status === 'triggered') loadContext(trigger);
      };

      const handleAct = id => {
        DS.triggers.act(id);
        DS.activity.log('trigger_acted', `Acted on: "${DS.triggers.get(id)?.title}"`, { id });
        onRefresh();
      };

      const STATUS_STYLE = {
        watching:  'bg-blue-50 text-blue-700 border-blue-200',
        triggered: 'bg-amber-50 text-amber-700 border-amber-200',
        acted:     'bg-emerald-50 text-emerald-700 border-emerald-200',
        expired:   'bg-gray-100 text-gray-400 border-gray-200',
      };
      const STATUS_ICON = { watching:'👁', triggered:'⚡', acted:'✅', expired:'💨' };
      const COND_LABEL  = { rate:'📉 Rate', price:'💲 Price', custom:'🔍 Custom' };

      const countOf = s => all.filter(t => t.status === s).length;

      return (
        <div className="p-5">
          {/* Header row */}
          <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
            <div className="flex gap-1 bg-gray-100 p-1 rounded-xl flex-wrap">
              {['watching','triggered','acted','expired','all'].map(s => (
                <button key={s} onClick={() => setFilter(s)}
                  className={`px-3 py-1 rounded-lg text-xs font-medium transition-colors capitalize ${filter===s ? 'bg-white shadow text-indigo-600' : 'text-gray-500 hover:text-gray-700'}`}>
                  {s}{s!=='all' && countOf(s) > 0 ? <span className="ml-1 opacity-60">({countOf(s)})</span> : ''}
                </button>
              ))}
            </div>
            <button onClick={() => setShowAdd(true)}
              className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition-colors">
              + Trigger
            </button>
          </div>

          {/* Add form */}
          {showAdd && (
            <Card className="p-5 mb-4 border-indigo-200 space-y-4">
              <h3 className="font-semibold text-gray-700 text-sm">New Trigger Alert</h3>
              <Input label="Alert Name *" placeholder="e.g. Mortgage rate drops to refinance zone" value={form.title} onChange={e => f({title:e.target.value})} autoFocus />
              <div className="grid grid-cols-2 gap-3">
                <Select label="Condition Type" value={form.conditionType} onChange={e => f({conditionType:e.target.value})}>
                  <option value="rate">Rate (e.g. mortgage %)</option>
                  <option value="price">Price (e.g. stock / commodity)</option>
                  <option value="custom">Custom (Andy monitors via web)</option>
                </Select>
                <Input
                  label={form.conditionType==='rate' ? 'Threshold (%) — alert when below' : form.conditionType==='price' ? 'Threshold ($) — alert when below' : 'Threshold / Target value'}
                  placeholder={form.conditionType==='rate' ? '6.50' : form.conditionType==='price' ? '150.00' : 'e.g. 0.62'}
                  value={form.threshold} onChange={e => f({threshold:e.target.value})} />
              </div>
              {form.conditionType === 'custom' && (
                <div>
                  <label className="text-xs text-gray-500 block mb-1">Describe what to monitor</label>
                  <textarea rows={2} className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                    placeholder="e.g. Alert me when AUD/USD exchange rate drops below 0.62"
                    value={form.notes} onChange={e => f({notes:e.target.value})} />
                </div>
              )}
              <div className="grid grid-cols-2 gap-3">
                <Select label="Check Frequency" value={form.checkFrequency} onChange={e => f({checkFrequency:e.target.value})}>
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="manual">Manual only</option>
                </Select>
                <div>
                  <label className="text-xs text-gray-500 block mb-1">Days to Act After Trigger</label>
                  <input type="number" min="1" max="90" className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                    value={form.actionDeadlineDays} onChange={e => f({actionDeadlineDays:e.target.value})} />
                </div>
              </div>
              <div className="flex gap-2">
                <Btn onClick={handleAdd} disabled={!form.title.trim() || !form.threshold.toString().trim()}>Save Trigger</Btn>
                <Btn variant="ghost" onClick={() => { setShowAdd(false); setForm(EMPTY); }}>Cancel</Btn>
              </div>
            </Card>
          )}

          {shown.length === 0 && (
            <EmptyState icon="⚡" text={filter==='watching' ? 'No active triggers. Add one to start monitoring financial conditions.' : `No ${filter} triggers.`} />
          )}

          {/* Trigger list */}
          <div className="space-y-2">
            {shown.map(trigger => {
              const daysLeft = trigger.actionDeadline ? DS.daysUntil(trigger.actionDeadline) : null;
              const card     = contextCards[trigger.id];
              const isExpanded = expandedId === trigger.id;

              return (
                <div key={trigger.id} className={`rounded-xl border overflow-hidden ${trigger.status==='triggered' ? 'border-amber-300 shadow-sm' : 'border-gray-200'}`}>

                  {/* Main row */}
                  <div className={`px-4 py-3.5 flex items-start gap-3 ${trigger.status==='triggered' ? 'bg-amber-50' : 'bg-white'}`}>
                    <div className="flex-1 min-w-0 space-y-1">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-semibold text-gray-800">{trigger.title}</span>
                        <span className="text-[10px] bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded font-medium shrink-0">
                          {COND_LABEL[trigger.conditionType] || trigger.conditionType}
                        </span>
                        <span className="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-mono font-semibold shrink-0">
                          {trigger.conditionType==='rate' ? `< ${trigger.threshold}%` : trigger.conditionType==='price' ? `< $${trigger.threshold}` : `≤ ${trigger.threshold}`}
                        </span>
                        {trigger.lastValue && (
                          <span className="text-xs text-gray-500 shrink-0">→ <span className="font-mono font-semibold text-gray-800">{trigger.lastValue}</span></span>
                        )}
                      </div>
                      <div className="flex items-center gap-3 flex-wrap">
                        <span className={`text-[11px] px-2 py-0.5 rounded-full border font-semibold ${STATUS_STYLE[trigger.status]}`}>
                          {STATUS_ICON[trigger.status]} {trigger.status}
                        </span>
                        {trigger.lastChecked && (
                          <span className="text-[11px] text-gray-400">
                            Last checked {new Date(trigger.lastChecked).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
                          </span>
                        )}
                        {trigger.lastError && (
                          <span className="text-[11px] text-red-400" title={trigger.lastError}>⚠ Check failed</span>
                        )}
                        {trigger.status==='triggered' && daysLeft!==null && (
                          <span className={`text-[11px] font-bold ${daysLeft<=2 ? 'text-red-600' : 'text-amber-600'}`}>
                            ⏰ {daysLeft<0 ? `${Math.abs(daysLeft)}d overdue` : daysLeft===0 ? 'Act today!' : `${daysLeft}d to act`}
                          </span>
                        )}
                      </div>
                    </div>

                    {/* Action buttons */}
                    <div className="flex items-center gap-1.5 shrink-0">
                      {trigger.status==='watching' && (
                        <button onClick={() => handleCheck(trigger)} disabled={checking===trigger.id || !apiKey}
                          className="text-xs px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium transition-colors disabled:opacity-40 flex items-center gap-1.5">
                          {checking===trigger.id
                            ? <span className="w-3 h-3 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin inline-block" />
                            : '🔍'}
                          Check
                        </button>
                      )}
                      {trigger.status==='triggered' && (
                        <>
                          <button onClick={() => handleAct(trigger.id)}
                            className="text-xs px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-medium transition-colors">
                            ✓ Mark Acted
                          </button>
                          <button onClick={() => handleExpand(trigger)}
                            className={`text-xs px-2.5 py-1.5 rounded-lg transition-colors ${isExpanded ? 'bg-gray-200 text-gray-600' : 'bg-gray-100 hover:bg-gray-200 text-gray-500'}`}>
                            {isExpanded ? '▲' : '▼'}
                          </button>
                        </>
                      )}
                      <button onClick={() => { DS.triggers.delete(trigger.id); onRefresh(); }}
                        className="text-gray-300 hover:text-red-400 text-sm px-1 py-1.5 transition-colors">✕</button>
                    </div>
                  </div>

                  {/* Expanded context card */}
                  {isExpanded && (
                    <div className="border-t border-amber-200 bg-white px-4 py-4 space-y-3">
                      <p className="text-[11px] font-bold text-amber-700 uppercase tracking-wider">Context & Next Steps</p>
                      {card?.loading ? (
                        <div className="flex items-center gap-2 text-sm text-gray-500">
                          <div className="w-4 h-4 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin shrink-0" />
                          Analysing opportunity…
                        </div>
                      ) : card?.text ? (
                        <p className="text-sm text-gray-700 leading-relaxed">{card.text}</p>
                      ) : null}
                      {trigger.triggerResult?.recommendation && (
                        <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                          <p className="text-xs text-amber-800 font-medium">💡 {trigger.triggerResult.recommendation}</p>
                        </div>
                      )}
                      {trigger.triggerResult?.source && (
                        <p className="text-[11px] text-gray-400">Source: {trigger.triggerResult.source}</p>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── Goals ────────────────────────────────────────────────────────────────────
    function GoalsView({ tick, onRefresh }) {
      const [editingSelf, setEditingSelf] = useState(false);
      const [newGoal, setNewGoal] = useState('');
      const [editingFam, setEditingFam] = useState(null);
      const [newPriority, setNewPriority] = useState('');

      const selfData = window.storage.get('goals:self') || { items: [] };
      const famGoals = Object.entries(window.storage.getAll('goals:family')).filter(([,v]) => v);

      const addSelfGoal = () => {
        if (!newGoal.trim()) return;
        const items = [...selfData.items, { id: genId('goal'), text: newGoal.trim() }];
        window.storage.set('goals:self', { ...selfData, items });
        setNewGoal(''); setEditingSelf(false); onRefresh();
      };

      const removeSelfGoal = id => {
        window.storage.set('goals:self', { ...selfData, items: selfData.items.filter(i => i.id !== id) });
        onRefresh();
      };

      const addFamPriority = (key, fg) => {
        if (!newPriority.trim()) return;
        const priorities = [...(fg.priorities || []), { id: genId('p'), text: newPriority.trim() }];
        window.storage.set(key, { ...fg, priorities });
        setNewPriority(''); setEditingFam(null); onRefresh();
      };

      const removeFamPriority = (key, fg, pid) => {
        window.storage.set(key, { ...fg, priorities: fg.priorities.filter(p => p.id !== pid) });
        onRefresh();
      };

      const famIcon = r => {
        if (!r) return '👤';
        r = r.toLowerCase();
        if (r.includes('child') || r.includes('son') || r.includes('daughter')) return '👦';
        if (r.includes('spouse') || r.includes('wife') || r.includes('husband') || r.includes('partner')) return '💑';
        return '👤';
      };

      return (
        <div className="p-5 space-y-6 max-w-2xl">
          {/* Personal priorities */}
          <Card className="p-5">
            <div className="flex items-start justify-between mb-4">
              <div>
                <h2 className="font-bold text-gray-800 text-base">My Priorities</h2>
                <p className="text-xs text-gray-400 mt-0.5">What I'm building toward</p>
              </div>
              <Btn size="sm" onClick={() => setEditingSelf(true)}>+ Add</Btn>
            </div>
            <div className="space-y-3">
              {selfData.items.length === 0 && <p className="text-sm text-gray-400">No priorities set yet.</p>}
              {selfData.items.map((item, i) => (
                <div key={item.id} className="group flex items-start gap-3">
                  <div className="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs flex items-center justify-center font-bold shrink-0 mt-0.5">{i + 1}</div>
                  <p className="flex-1 text-sm text-gray-700 leading-relaxed">{item.text}</p>
                  <button onClick={() => removeSelfGoal(item.id)} className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 text-xs mt-0.5 transition-all">✕</button>
                </div>
              ))}
            </div>
            {editingSelf && (
              <div className="mt-4 flex gap-2">
                <input className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                  placeholder="Add priority…" value={newGoal} onChange={e => setNewGoal(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && addSelfGoal()} autoFocus />
                <Btn size="sm" onClick={addSelfGoal}>Add</Btn>
                <Btn size="sm" variant="ghost" onClick={() => setEditingSelf(false)}>✕</Btn>
              </div>
            )}
          </Card>

          {/* Family focus */}
          <div>
            <h2 className="font-bold text-gray-800 text-base mb-3">Family Focus</h2>
            {famGoals.length === 0 && <EmptyState icon="👨‍👩‍👧" text="No family priorities yet. Add family members first." />}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {famGoals.map(([key, fg]) => (
                <Card key={key} className="p-4">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-2">
                      <span className="text-xl">{famIcon(fg.relation)}</span>
                      <div>
                        <div className="font-semibold text-sm text-gray-800">{fg.name}</div>
                        {fg.relation && <div className="text-xs text-indigo-400 capitalize">{fg.relation}</div>}
                      </div>
                    </div>
                    <Btn size="sm" variant="ghost" onClick={() => setEditingFam(key)}>+</Btn>
                  </div>
                  <div className="space-y-2">
                    {(fg.priorities || []).map(p => (
                      <div key={p.id} className="group flex items-center gap-2">
                        <span className="w-1.5 h-1.5 rounded-full bg-indigo-300 shrink-0" />
                        <span className="flex-1 text-sm text-gray-600">{p.text}</span>
                        <button onClick={() => removeFamPriority(key, fg, p.id)} className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 text-xs transition-all">✕</button>
                      </div>
                    ))}
                    {(fg.priorities || []).length === 0 && <p className="text-xs text-gray-400">No priorities yet.</p>}
                  </div>
                  {editingFam === key && (
                    <div className="mt-3 flex gap-1">
                      <input className="flex-1 border border-gray-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-300"
                        placeholder="Add priority…" value={newPriority} onChange={e => setNewPriority(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && addFamPriority(key, fg)} autoFocus />
                      <Btn size="sm" onClick={() => addFamPriority(key, fg)}>Add</Btn>
                      <Btn size="sm" variant="ghost" onClick={() => setEditingFam(null)}>✕</Btn>
                    </div>
                  )}
                </Card>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─── Seed initial data ────────────────────────────────────────────────────────
    function seedInitialData() {
      if (window.storage.get('settings:data_seeded')) return;

      // Tasks — use DS.tasks.create so schemas are correct
      [
        { title: 'Legal inheritance',                               priority: 'P0', category: 'legal'    },
        { title: 'VISA',                                            priority: 'P0', category: 'legal'    },
        { title: 'Shlesh Aerospace',                                priority: 'P0', category: 'work'     },
        { title: 'Important offering documents to be consolidated', priority: 'P1', category: 'financial'},
        { title: 'Baro compliance',                                 priority: 'P1', category: 'legal'    },
        { title: 'Go over commercial videos',                       priority: 'P2', category: 'work'     },
        { title: 'Mold treatment',                                  priority: 'P2', category: 'home'     },
        { title: 'Gutter cleaning',                                 priority: 'P3', category: 'home'     },
      ].forEach(t => DS.tasks.create(t));

      // Personal goals (stored as-is — not a DS entity)
      window.storage.set('goals:self', {
        items: [
          { id: genId('goal'), text: 'I am most disciplined, most focused, most articulate' },
          { id: genId('goal'), text: 'Financial freedom & Investing' },
          { id: genId('goal'), text: 'Give back to world' },

      });

      const famDefs = [
        { name: 'Child 1', relationship: 'son',     priorities: ['Aerospace', 'More love'] },
        { name: 'Child 2', relationship: 'daughter', priorities: ['Health'] },
        { name: 'Spouse',  relationship: 'spouse',  priorities: ['Health', 'More emotional support'] },
      ];
      famDefs.forEach(({ name, relationship, priorities }) => {
        const member = DS.family.create({ name, relationship, role: 'dependent' });

          id:         member.id,
          name,
          relation:   relationship,
          priorities: priorities.map(text => ({ id: genId('p'), text })),

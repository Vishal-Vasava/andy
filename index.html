<body>
  <div id="root"></div>

  <script type="text/babel">
    // Show errors visibly — overlay on top of React DOM instead of replacing it.
    // NEVER use root.innerHTML here: that nukes React's DOM nodes while React is
    // still in its commit phase, causing removeChildFromContainer to crash.
    window.onerror = (msg, src, line, col, err) => {
      if (document.querySelector('[data-err]')) return;
      const div = document.createElement('div');
      div.setAttribute('data-err', '');
      div.style.cssText = 'position:fixed;inset:0;z-index:99999;padding:24px;font-family:monospace;color:#dc2626;background:#fef2f2;overflow:auto';
      div.innerHTML = `<strong>Andy crashed</strong><br><br>${msg}<br><small>Line ${line} · ${src}</small>${err ? '<br><br><pre style="white-space:pre-wrap;font-size:11px">' + err.stack + '</pre>' : ''}`;
      document.body.appendChild(div);
    };

    const { useState, useEffect, useReducer, useRef, useCallback } = React;

    // ─── Storage ─────────────────────────────────────────────────────────────────
    window.storage = {
      get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
      set(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
      delete(key) { localStorage.removeItem(key); },
      clear() { localStorage.clear(); },
      keys() { return Array.from({ length: localStorage.length }, (_, i) => localStorage.key(i)); },
      getAll(prefix) {
        const result = {};
        this.keys().forEach(k => {
          if (k === prefix || k.startsWith(prefix + ':')) result[k] = this.get(k);
        });
        return result;
      },
    };

    // ─── Theme system ─────────────────────────────────────────────────────────────
    const THEMES = {
      indigo:  { label:'Indigo',  accent:'#4f46e5', p:{50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b'} },
      violet:  { label:'Violet',  accent:'#7c3aed', p:{50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',300:'#c4b5fd',400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',800:'#5b21b6',900:'#4c1d95',950:'#2e1065'} },
      blue:    { label:'Blue',    accent:'#2563eb', p:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a',950:'#172554'} },
      teal:    { label:'Teal',    accent:'#0d9488', p:{50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a',950:'#042f2e'} },
      emerald: { label:'Emerald', accent:'#059669', p:{50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b',950:'#022c22'} },
      rose:    { label:'Rose',    accent:'#e11d48', p:{50:'#fff1f2',100:'#ffe4e6',200:'#fecdd3',300:'#fda4af',400:'#fb7185',500:'#f43f5e',600:'#e11d48',700:'#be123c',800:'#9f1239',900:'#881337',950:'#4c0519'} },
      amber:   { label:'Amber',   accent:'#d97706', p:{50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f',950:'#451a03'} },
      slate:   { label:'Slate',   accent:'#475569', p:{50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a',950:'#020617'} },
    };

    function applyTheme(themeId) {
      const theme = THEMES[themeId] || THEMES.indigo;
      let el = document.getElementById('andy-theme');
      if (!el) { el = document.createElement('style'); el.id = 'andy-theme'; document.head.appendChild(el); }
      if (themeId === 'indigo') { el.textContent = ''; return; }
      const p = theme.p;
      const shades = [50,100,200,300,400,500,600,700,800,900,950];
      const lines = [];
      shades.forEach(s => {
        const c = p[s];
        lines.push(`.bg-indigo-${s}{background-color:${c}!important}`);
        lines.push(`.text-indigo-${s}{color:${c}!important}`);
        lines.push(`.border-indigo-${s}{border-color:${c}!important}`);
        lines.push(`.ring-indigo-${s}{--tw-ring-color:${c}!important}`);
        lines.push(`.from-indigo-${s}{--tw-gradient-from:${c}!important}`);
        lines.push(`.hover\\:bg-indigo-${s}:hover{background-color:${c}!important}`);
        lines.push(`.hover\\:text-indigo-${s}:hover{color:${c}!important}`);
        lines.push(`.hover\\:border-indigo-${s}:hover{border-color:${c}!important}`);
        lines.push(`.focus\\:ring-indigo-${s}:focus{--tw-ring-color:${c}!important}`);
      });
      el.textContent = lines.join('');
    }
    // Apply saved theme immediately (before first React render — no flash)
    applyTheme(window.storage.get('settings:theme') || 'indigo');

    // ─── Utilities ────────────────────────────────────────────────────────────────
    const genId = prefix => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,5)}`;
    const todayISO = () => new Date().toISOString().split('T')[0];
    const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '';
    const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; };
    const daysUntil = iso => Math.ceil((new Date(iso + 'T00:00:00') - new Date()) / 86400000);

    function calcStreak(completions = []) {
      const sorted = [...completions].sort().reverse();
      let streak = 0, check = todayISO();
      for (const d of sorted) {
        if (d === check || d === addDays(check, -1)) { streak++; check = addDays(d, -1); }
        else break;
      }
      return streak;
    }

    function calcRate(completions = [], days) {
      const cutoff = addDays(todayISO(), -days);
      return Math.round(completions.filter(d => d >= cutoff).length / days * 100);
    }

    // ─── Deadline Alert Engine ────────────────────────────────────────────────────
    function runDeadlineAlerts() {
      const today = DS.todayISO();
      DS.deadlines.checkOverdue();

      const fired = [];
      for (const d of DS.deadlines.getDueAlerts()) {
        const key = `settings:alert_shown:${d.id}:${d.daysLeft}:${today}`;
        if (window.storage.get(key)) continue;
        window.storage.set(key, true);
        DS.activity.log('deadline_alert', `"${d.title}" due in ${d.daysLeft}d`, { id: d.id, daysLeft: d.daysLeft });
        fired.push(d);
      }

      const family = DS.family.list();
      const escalations = [];
      DS.deadlines.list()
        .filter(d => d.status !== 'done' && d.assignedTo && d.assignedTo !== 'self')
        .forEach(d => {
          const days = DS.daysUntil(d.dueDate);
          if (days > 3 || days < -14) return;
          const member = family.find(m => m.id === d.assignedTo);
          if (member) escalations.push({ deadline: d, member, daysLeft: days });
        });

      return { fired, escalations };
    }

    // ─── Pattern Analysis Engine ──────────────────────────────────────────────────
    function collectAnalysisData() {
      const today  = DS.todayISO();
      const cut30  = addDays(today, -30);

      // 1. Chronically deferred tasks (3+ deferrals)
      const deferredTasks = DS.tasks.listChronicallyDeferred(3).map(t => ({
        title: t.title, category: t.category || 'uncategorized', deferralCount: t.deferralCount, dueDate: t.dueDate,
      }));

      // 2. Low-adherence habits (<50% in 30d)
      const lowHabits = DS.habits.list()
        .map(h => ({ name: h.name, adherence30d: DS.habits.adherenceRate(h.id, 30), currentStreak: h.currentStreak || 0 }))
        .filter(h => h.adherence30d < 50);

      // 3. Repeatedly snoozed deadlines
      const snoozedDeadlines = DS.deadlines.list()
        .filter(d => (d.deferralCount || 0) >= 2)
        .map(d => ({ title: d.title, category: d.category, deferralCount: d.deferralCount, dueDate: d.dueDate, status: d.status }));

      // 4. Time-of-day productivity (from activity log)
      const bucketLabel = h => h < 9 ? 'early_morning' : h < 12 ? 'morning' : h < 14 ? 'midday' : h < 17 ? 'afternoon' : h < 20 ? 'evening' : 'night';
      const hourBuckets = {};
      DS.activity.listByType('task_completed').forEach(a => {
        const b = bucketLabel(new Date(a.timestamp).getHours());
        hourBuckets[b] = (hourBuckets[b] || 0) + 1;
      });
      const peakTime = Object.entries(hourBuckets).sort((a, b) => b[1] - a[1])[0]?.[0] || 'unknown';

      // 5. Overdue items by category
      const overdueByCategory = {};
      DS.tasks.listOverdue().forEach(t => { const c = t.category || 'uncategorized'; overdueByCategory[c] = (overdueByCategory[c]||0)+1; });
      DS.deadlines.list().filter(d => d.status === 'overdue').forEach(d => { const c = d.category||'other'; overdueByCategory[c] = (overdueByCategory[c]||0)+1; });

      // 6. Worst day of week for habit misses
      const missDay = {};
      DS.habits.list().forEach(h =>
        (h.log||[]).filter(e => !e.done && e.date >= cut30).forEach(e => {
          const d = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(e.date+'T12:00:00').getDay()];
          missDay[d] = (missDay[d]||0)+1;
        })
      );
      const worstHabitDay = Object.entries(missDay).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;

      return {
        analysisDate: today,
        totalOpenTasks: DS.tasks.listOpen().length,
        totalOverdue: DS.tasks.listOverdue().length,
        deferredTasks,
        lowAdherenceHabits: lowHabits,
        snoozedDeadlines,
        peakProductivityTime: peakTime,
        hourDistribution: hourBuckets,
        overdueByCategory,
        worstHabitDay,
      };
    }

    async function runPatternAnalysis(apiKey) {
      const data = collectAnalysisData();
      const name = window.storage.get('settings:user_name') || 'the user';

      const prompt = `Analyze ${name}'s behavioral patterns over the last 4 weeks and generate 3-5 actionable insights.

Data:
${JSON.stringify(data, null, 2)}

Return ONLY a valid JSON array. No markdown, no explanation. Each object must have exactly these fields:
{
  "pattern": "Short description of the pattern detected",
  "evidence": "Specific data points supporting it (reference actual names and numbers)",
  "suggestion": "One concrete, specific change ${name} can make this week",
  "urgency": "low|medium|high"
}

Good insight examples:
- pattern about deferring financial tasks on certain days
- pattern about habit streaks breaking on weekends
- pattern about educational/admin tasks having highest deferral rates
- pattern about peak productivity windows being underutilized

Be specific. Reference actual task titles, habit names, and numbers from the data above.`;

      const raw = await CS.callLLM(
        'You are a behavioral analyst. Output ONLY a valid JSON array. Never use markdown fences or any text outside the JSON array.',
        prompt,
        1200
      );
      const cleaned = raw.replace(/^```json\s*/im,'').replace(/^```\s*/im,'').replace(/\s*```$/im,'').trim();
      const insights = JSON.parse(cleaned);

      window.storage.set('settings:insights', insights);
      window.storage.set('settings:insights_date', DS.todayISO());
      return insights;
    }

    // ─── Habit nudge + Medication miss check ─────────────────────────────────────
    function runHabitNudges() {
      const hour = new Date().getHours();
      if (hour < 21) return []; // only nudge after 9pm
      const today = DS.todayISO();
      const nudgeKey = `settings:habit_nudge_sent:${today}`;
      if (window.storage.get(nudgeKey)) return [];
      const pending = DS.habits.list().filter(h => {
        if (h.frequency !== 'daily') return false;
        return !(h.log || []).some(e => e.date === today && e.done);
      });
      if (pending.length) window.storage.set(nudgeKey, true);
      return pending;
    }

    function getMedConsecutiveMisses(med) {
      const today = DS.todayISO();
      let count = 0;
      let cursor = addDays(today, -1); // start from yesterday
      for (let i = 0; i < 30; i++) {
        const entry = (med.log || []).find(e => e.date === cursor);
        if (!entry || !entry.taken) { count++; cursor = addDays(cursor, -1); }
        else break;
      }
      return count;
    }

    // ─── Evening Digest Engine ───────────────────────────────────────────────────
    function collectEveningData() {
      const today    = DS.todayISO();
      const tomorrow = addDays(today, 1);

      // Completed today — from activity log
      const completedToday = DS.activity.listByType('task_completed')
        .filter(a => a.timestamp.startsWith(today))
        .map(a => ({ title: a.details.replace(/^Completed: /, '') }));

      // Due today but not done
      const slippedToday = DS.tasks.list()
        .filter(t => t.dueDate === today && !t.completedAt)
        .map(t => ({ title: t.title, category: t.category || 'general', priority: t.priority }));

      // Deferred today — from activity log
      const deferredToday = DS.activity.listByType('task_deferred')
        .filter(a => a.timestamp.startsWith(today))
        .map(a => ({
          title: a.details.replace(/^Deferred: /, '').split(' (')[0],
          count: a.metadata.deferralCount || 1,
        }));

      // Habits
      const dailyHabits   = DS.habits.list().filter(h => h.frequency === 'daily');
      const habitsDone    = dailyHabits.filter(h => (h.log||[]).some(e => e.date === today && e.done));
      const habitsMissed  = dailyHabits.filter(h => !(h.log||[]).some(e => e.date === today && e.done));

      // Medications
      const allMeds    = DS.medications.list();
      const medsTaken  = allMeds.filter(m => (m.log||[]).some(e => e.date === today && e.taken));
      const medsMissed = allMeds.filter(m => !(m.log||[]).some(e => e.date === today && e.taken));

      // Tomorrow
      const dlDueTomorrow   = DS.deadlines.list()
        .filter(d => d.dueDate === tomorrow && d.status !== 'done')
        .map(d => ({ title: d.title, category: d.category }));
      const tasksDueTomorrow = DS.tasks.list()
        .filter(t => t.dueDate === tomorrow && !t.completedAt)
        .map(t => ({ title: t.title, priority: t.priority }));
      const top3Open = DS.tasks.listByPriority()
        .filter(t => !t.completedAt).slice(0, 3)
        .map(t => ({ title: t.title, priority: t.priority, category: t.category || '' }));

      return {
        today,
        completedToday,
        slippedToday,
        deferredToday,
        habitsTotal:      dailyHabits.length,
        habitsDoneCount:  habitsDone.length,
        habitsDoneNames:  habitsDone.map(h => h.name),
        habitsMissedNames:habitsMissed.map(h => h.name),
        medsTotal:        allMeds.length,
        medsTakenCount:   medsTaken.length,
        medsMissedNames:  medsMissed.map(m => m.name),
        dlDueTomorrow,
        tasksDueTomorrow,
        top3Open,
      };
    }

    async function generateEveningDigest(apiKey) {
      const d    = collectEveningData();
      const name = window.storage.get('settings:user_name') || 'there';

      const fmt = arr => arr.length ? arr.map(i => `• ${i.title}`).join('\n') : '• None';

      const tomorrowItems = [
        ...d.dlDueTomorrow.map(x => `• ${x.title} [${x.category}]`),
        ...d.tasksDueTomorrow.map(x => `• ${x.title} [${x.priority}]`),
      ];

      const prompt = `Generate Andy's evening digest for ${name}. Date: ${d.today}.

Today's summary:
- Completed:
${fmt(d.completedToday)}

- Slipped (due today, not done):
${d.slippedToday.length ? d.slippedToday.map(t => `• ${t.title} [${t.category}]`).join('\n') : '• None'}

- Deferred today:
${d.deferredToday.length ? d.deferredToday.map(t => `• ${t.title} (${t.count}× total)`).join('\n') : '• None'}

- Habits: ${d.habitsDoneCount}/${d.habitsTotal} completed${d.habitsMissedNames.length ? ' — missed: ' + d.habitsMissedNames.join(', ') : ''}
- Medications: ${d.medsTakenCount}/${d.medsTotal} taken${d.medsMissedNames.length ? ' — missed: ' + d.medsMissedNames.join(', ') : ''}

Tomorrow's preview:
- Due tomorrow:
${tomorrowItems.length ? tomorrowItems.join('\n') : '• Nothing due'}

- Scheduled priorities:
${d.top3Open.length ? d.top3Open.map(t => `• ${t.title} [${t.priority}]`).join('\n') : '• No open tasks'}

Generate a concise evening digest (under 120 words) that:
1. Opens with honest assessment (good day / mixed / rough — be real, not cheerleady)
2. Acknowledges what got done
3. Names what slipped without judgment, just facts
4. Previews tomorrow's 3 most important items
5. Closes with one practical suggestion for tomorrow

Tone: like a trusted friend giving an honest end-of-day debrief. Plain text, no bullet points, no markdown.`;

      const text = await CS.callLLM(
        'You are Andy, a trusted personal assistant. Write an honest, concise evening digest. Plain prose only — no markdown, no headers, no bullet points.',
        prompt,
        300
      );
      window.storage.set('settings:digest', text);
      window.storage.set('settings:digest_data', d);
      window.storage.set('settings:digest_date', d.today);
      return { text, data: d };
    }

    // ─── Trigger Check Engine ────────────────────────────────────────────────────

      const condMap = {
        rate:   `30-year fixed mortgage rate — user threshold: below ${trigger.threshold}%`,

        custom: trigger.notes || trigger.title,
      };
      const condDesc = condMap[trigger.conditionType] || trigger.title;

Trigger name: "${trigger.title}"

Threshold: ${trigger.threshold}
Notes: ${trigger.notes || 'none'}

Search for the most current real-time data. Then respond with ONLY a valid JSON object:
{
  "currentValue": "current value as a string e.g. '6.72%' or '$148.30'",
  "thresholdMet": true or false,
  "source": "data source name and date",

      const raw = await CS.callLLM(

Condition: ${trigger.conditionType} trigger — threshold ${trigger.threshold}
Current value: ${checkResult.currentValue || 'unknown'}

In 3-5 sentences (plain text, no markdown, no bullets):

Be precise and actionable.`;

      return await CS.callLLM(

    // ─── Seasonal Checklist Engine ───────────────────────────────────────────────
    const SEASONS = ['spring','summer','fall','winter'];

    const SEASON_META = {
      spring: { label:'Spring', emoji:'🌸', months:[3,4,5] },
      summer: { label:'Summer', emoji:'☀️', months:[6,7,8] },
      fall:   { label:'Fall',   emoji:'🍂', months:[9,10,11] },
      winter: { label:'Winter', emoji:'❄️', months:[12,1,2] },
    };

    const SEASONAL_TEMPLATES = {
      spring: [
        'HVAC filter change','Gutter cleaning','Deck inspection','Smoke detector test',
        'Car AC check','Lawn mower service','Sprinkler system startup','Window screen cleaning',
        'Attic ventilation check','Exterior paint inspection','Water heater flush','Dryer vent cleaning',
      ],
      summer: [
        'AC tune-up','Pool/patio furniture setup','Pest inspection','Sun damage check on deck',
        'Check window seals','Irrigation system check','Outdoor lighting check','Garage door lubrication',
      ],
      fall: [
        'Furnace inspection','Weatherstripping check','Leaf gutter clearing','Chimney sweep',
        'Winterize sprinklers','Check insulation','Reverse ceiling fans','Emergency kit refresh',
        'Tire swap (if applicable)',
      ],
      winter: [
        'Pipe insulation check','Ice dam prevention','Emergency supply check','Heating system check',
        'Check for drafts','Test carbon monoxide detectors','Review insurance policies',
      ],
    };

    function getCurrentSeason() {
      const m = new Date().getMonth() + 1;
      if (m >= 3 && m <= 5)  return 'spring';
      if (m >= 6 && m <= 8)  return 'summer';
      if (m >= 9 && m <= 11) return 'fall';
      return 'winter';
    }

    function clKey(season, year) { return `settings:seasonal:${season}:${year}`; }

    function loadSeasonalCL(season, year) { return window.storage.get(clKey(season, year)); }

    function saveSeasonalCL(season, year, data) { window.storage.set(clKey(season, year), data); }

    function initSeasonalCL(season, year) {
      const existing = loadSeasonalCL(season, year);
      if (existing) return existing;

      // Carry over un-done, non-NA items from the previous year's same season
      const prev = loadSeasonalCL(season, year - 1);
      const carryOvers = prev
        ? prev.items.filter(i => !i.done && !i.na)
            .map(i => ({ ...i, id: genId('si'), carriedOver: true, done: false, notes: i.notes || '' }))
        : [];

      const templateItems = (SEASONAL_TEMPLATES[season] || []).map(name => ({
        id: genId('si'), name, done: false, na: false, notes: '', carriedOver: false, custom: false,
      }));

      const data = { season, year, items: [...carryOvers, ...templateItems] };
      saveSeasonalCL(season, year, data);
      return data;
    }

    // ─── Nav config ───────────────────────────────────────────────────────────────
    const NAV = [
      { id: 'dashboard',   label: 'Dashboard',   icon: '🏠' },
      { id: 'tasks',       label: 'Tasks',        icon: '✅' },
      { id: 'deadlines',   label: 'Deadlines',    icon: '📅' },
      { id: 'family',      label: 'Family',       icon: '👨‍👩‍👧' },
      { id: 'habits',      label: 'Habits',       icon: '🔄' },
      { id: 'medications', label: 'Medications',  icon: '💊' },
      { id: 'checklists',  label: 'Checklists',   icon: '📋' },
      { id: 'goals',       label: 'Goals',        icon: '🎯' },
      { id: 'triggers',    label: 'Triggers',     icon: '⚡' },
      { id: 'journal',     label: 'Journal',      icon: '📓' },
      { id: 'mind',        label: 'Mind',         icon: '🧠' },
      { id: 'sensei',      label: 'Sensei',       icon: '🥋' },
      { id: 'vision',      label: 'Vision',       icon: '🌟' },
      { id: 'settings',    label: 'Settings',     icon: '⚙️' },
    ];

    // ─── Reducer ─────────────────────────────────────────────────────────────────
    function reducer(state, action) {
      switch (action.type) {
        case 'NAV':         window.storage.set('app:section', action.payload); return { ...state, section: action.payload, seasonalBanner: action.payload === 'checklists' ? null : state.seasonalBanner };
        case 'SEASONAL_BANNER': return { ...state, seasonalBanner: action.payload };
        case 'CHAT_INPUT':  return { ...state, chatInput: action.payload };
        case 'ADD_MSG':     return { ...state, messages: [...state.messages, action.payload] };
        case 'PATCH_MSG': {
          const messages = state.messages.map((m, i) =>
            i === action.index ? { ...m, ...action.patch } : m
          );
          return { ...state, messages };
        }
        case 'THINKING':    return { ...state, thinking: action.payload };
        case 'TOGGLE_SIDE': return { ...state, sidebarOpen: !state.sidebarOpen };
        case 'REFRESH':     return { ...state, tick: state.tick + 1 };
        case 'TOAST':            return { ...state, toast: action.payload }; // { text, variant } | null
        case 'BRIEFING_OPEN':    return { ...state, briefingOpen: true,  briefingLoading: true,  briefing: null };
        case 'BRIEFING_CLOSE':   return { ...state, briefingOpen: false };
        case 'BRIEFING_LOADING': return { ...state, briefingLoading: action.payload };
        case 'BRIEFING_SET':     return { ...state, briefingLoading: false, briefing: action.payload };
        case 'SET_ESCALATIONS':  return { ...state, escalations: action.payload };
        case 'DISMISS_ESCALATION': return { ...state, escalations: state.escalations.filter((_, i) => i !== action.index) };
        case 'SET_INSIGHTS':     return { ...state, insights: action.payload, insightsLoading: false };
        case 'INSIGHTS_LOADING': return { ...state, insightsLoading: action.payload };
        case 'DISMISS_INSIGHT':  return { ...state, insights: (state.insights || []).filter((_, i) => i !== action.index) };
        case 'ADD_TRIGGER_BANNER':    return { ...state, triggerBanners: [...state.triggerBanners, action.payload] };
        case 'DISMISS_TRIGGER_BANNER': return { ...state, triggerBanners: state.triggerBanners.filter((_, i) => i !== action.index) };
        case 'DIGEST_BANNER':    return { ...state, digestBanner: action.payload };
        case 'DIGEST_OPEN':      return { ...state, digestOpen: true,  digestLoading: true,  digest: null, digestData: null };
        case 'DIGEST_CLOSE':     return { ...state, digestOpen: false };
        case 'DIGEST_LOADING':   return { ...state, digestLoading: action.payload };
        case 'DIGEST_SET':           return { ...state, digestLoading: false, digest: action.payload.text, digestData: action.payload.data };
        case 'SET_INSTALL_BANNER':   return { ...state, installBanner: action.payload };
        default: return state;
      }
    }

    // ─── Shared Components ────────────────────────────────────────────────────────
    function Card({ children, className = '' }) {
      return <div className={`bg-white border border-gray-100 rounded-xl ${className}`}>{children}</div>;
    }

    function Btn({ children, onClick, variant = 'primary', size = 'md', disabled, className = '' }) {
      const base = 'inline-flex items-center gap-1.5 font-medium rounded-lg transition-colors disabled:opacity-40';
      const sizes = { sm: 'px-2.5 py-1 text-xs', md: 'px-3 py-1.5 text-sm', lg: 'px-4 py-2 text-sm' };
      const variants = {
        primary:  'bg-indigo-600 hover:bg-indigo-700 text-white',
        ghost:    'text-gray-500 hover:text-gray-700 hover:bg-gray-100',
        danger:   'text-red-500 border border-red-200 hover:bg-red-50',
        secondary:'bg-gray-100 hover:bg-gray-200 text-gray-700',
      };
      return (
        <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
          {children}
        </button>
      );
    }

    function Input({ label, ...props }) {
      return (
        <div>
          {label && <label className="text-xs text-gray-500 block mb-1">{label}</label>}
          <input className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" {...props} />
        </div>
      );
    }

    function Select({ label, children, ...props }) {
      return (
        <div>
          {label && <label className="text-xs text-gray-500 block mb-1">{label}</label>}
          <select className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300" {...props}>
            {children}
          </select>
        </div>
      );
    }

    function EmptyState({ icon, text }) {
      return (
        <div className="text-center py-14 text-gray-400">
          <div className="text-4xl mb-2">{icon}</div>
          <p className="text-sm">{text}</p>
        </div>
      );
    }

    function PriorityDot({ priority }) {
      const c = { high: 'bg-red-400', medium: 'bg-amber-400', low: 'bg-gray-300' };
      return <span className={`inline-block w-2 h-2 rounded-full shrink-0 ${c[priority] || 'bg-gray-300'}`} />;
    }

    // ─── Sidebar ─────────────────────────────────────────────────────────────────
    function Sidebar({ section, onNav, open }) {
      return (
        <aside className={`${open ? 'w-52' : 'w-0 overflow-hidden'} transition-all duration-200 bg-indigo-950 flex flex-col shrink-0 select-none`}>
          <div className="px-5 py-4 border-b border-indigo-800 flex items-center gap-3">
            <img src="andy2.png" alt="Andy" className="w-10 h-10 rounded-full object-cover shrink-0 ring-2 ring-indigo-700" />
            <div>
              <div className="text-xl font-bold text-white tracking-tight">Andy</div>
              <div className="text-indigo-400 text-[11px] mt-0.5">Personal Life Assistant</div>
            </div>
          </div>
          <nav className="flex-1 py-2 overflow-y-auto">
            {NAV.map(n => (
              <button key={n.id} onClick={() => onNav(n.id)}
                className={`w-full flex items-center gap-3 px-4 py-2.5 text-sm transition-colors text-left ${
                  section === n.id ? 'bg-indigo-700 text-white font-medium' : 'text-indigo-300 hover:bg-indigo-900 hover:text-white'
                }`}>
                <span className="text-base">{n.icon}</span>
                <span>{n.label}</span>
              </button>
            ))}
          </nav>
          <div className="px-4 py-3 border-t border-indigo-800 text-indigo-500 text-[10px]">
            Powered by Claude Sonnet 4
          </div>
        </aside>
      );
    }

    // ─── Header ──────────────────────────────────────────────────────────────────
    function Header({ section, onToggle, onBrief, thinking }) {
      const label = NAV.find(n => n.id === section)?.label || 'Andy';
      const dateStr = new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
      return (
        <header className="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shrink-0 z-10">
          <div className="flex items-center gap-3">
            <button onClick={onToggle} className="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-lg">☰</button>
            <div>
              <div className="font-semibold text-gray-800 leading-tight">{label}</div>
              <div className="text-[11px] text-gray-400">{dateStr}</div>
            </div>
          </div>
          <Btn onClick={onBrief} disabled={thinking} className="gap-1">
            ☀️ Morning Brief
          </Btn>
        </header>
      );
    }

    // ─── Toast ────────────────────────────────────────────────────────────────────
    function Toast({ toast, onDismiss }) {
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(onDismiss, 3500);
        return () => clearTimeout(t);
      }, [toast]);

      if (!toast) return null;

      const variants = {
        success: 'bg-emerald-600 text-white',
        error:   'bg-red-600 text-white',
        info:    'bg-indigo-600 text-white',
        warning: 'bg-amber-500 text-white',
      };
      const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };

      return (
        <div className={`fixed top-4 right-4 z-50 flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-sm font-medium animate-bounce-in ${variants[toast.variant || 'success']}`}
          style={{ animation: 'slideIn 0.2s ease-out' }}>
          <span className="text-base">{icons[toast.variant || 'success']}</span>
          <span>{toast.text}</span>
          <button onClick={onDismiss} className="ml-2 opacity-70 hover:opacity-100 text-xs">✕</button>
        </div>
      );
    }

    // ─── Action bubble (inline confirmation card) ─────────────────────────────────
    function ActionBubble({ msg, msgIndex, onConfirm, onCancel }) {
      const intentLabels = {
        create_task:        '📝 Create task',
        create_deadline:    '📅 Create deadline',
        log_habit:          '🔄 Log habit',
        log_medication:     '💊 Log medication',
        add_medication:     '💊 Add medication',
        create_checklist:   '📋 Create checklist',
        set_trigger:        '🔔 Set trigger',
        assign_family_task: '👨‍👩‍👧 Assign task',
        defer_task:         '⏩ Defer task',
        complete_task:      '✅ Complete task',
      };

      const { parsed, status } = msg;
      const label = intentLabels[parsed.intent] || parsed.intent;
      const isPending = status === 'pending';

      return (
        <div className="flex justify-start">
          <div className="max-w-[85%] space-y-2">
            {/* Andy label */}
            <div className="flex items-center gap-1.5 ml-1">
              <img src="andy2.png" alt="Andy" className="w-5 h-5 rounded-full object-cover" />
              <span className="text-[11px] text-indigo-500 font-semibold">Andy</span>
            </div>

            {/* Action card */}
            <div className={`border rounded-2xl p-3 text-sm ${
              isPending
                ? 'bg-indigo-50 border-indigo-200'
                : status === 'confirmed'
                  ? 'bg-emerald-50 border-emerald-200'
                  : 'bg-gray-50 border-gray-200'
            }`}>
              <div className="flex items-center gap-1.5 mb-1.5">
                <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${
                  isPending ? 'bg-indigo-100 text-indigo-700' : status === 'confirmed' ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-200 text-gray-500'
                }`}>{label}</span>
                {!isPending && (
                  <span className="text-xs font-medium">{status === 'confirmed' ? '✓ Done' : '✗ Cancelled'}</span>
                )}
              </div>
              <p className="text-gray-700 leading-relaxed">{parsed.confirmation}</p>
              {parsed.followup && isPending && (
                <p className="text-indigo-500 text-xs mt-1.5 italic">{parsed.followup}</p>
              )}
            </div>

            {/* Confirm / Cancel buttons (pending only) */}
            {isPending && (
              <div className="flex gap-2 ml-1">
                <button onClick={() => onConfirm(msgIndex, parsed)}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                  ✓ Yes, do it
                </button>
                <button onClick={() => onCancel(msgIndex)}
                  className="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
                  ✗ Cancel
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── Chat ─────────────────────────────────────────────────────────────────────
    function ChatPanel({ messages, input, onChange, onSend, onConfirm, onCancel, thinking }) {
      const scrollRef = useRef(null);
      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, thinking]);

      const handleKey = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } };

      return (
        <div className="border-t border-gray-200 bg-white shrink-0">
          {messages.length > 0 && (
            <div ref={scrollRef} className="chat-messages max-h-64 overflow-y-auto px-4 py-3 space-y-3 border-b border-gray-100 bg-gray-50">
              {messages.map((m, i) => {
                // Action confirmation card
                if (m.type === 'action') {
                  return <ActionBubble key={i} msg={m} msgIndex={i} onConfirm={onConfirm} onCancel={onCancel} />;
                }
                // System message (result / error)
                if (m.type === 'result') {
                  return (
                    <div key={i} className="flex justify-start">
                      <div className={`text-xs px-3 py-1.5 rounded-full border ${
                        m.variant === 'error'
                          ? 'bg-red-50 border-red-200 text-red-600'
                          : 'bg-emerald-50 border-emerald-200 text-emerald-700'
                      }`}>{m.content}</div>
                    </div>
                  );
                }
                // Regular user / assistant bubble
                return (
                  <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className="max-w-[82%]">
                      {m.role === 'assistant' && (
                        <div className="flex items-center gap-1.5 mb-1 ml-1">
                          <img src="andy2.png" alt="Andy" className="w-5 h-5 rounded-full object-cover" />
                          <span className="text-[11px] text-indigo-500 font-semibold">Andy</span>
                        </div>
                      )}
                      <div className={`px-3 py-2.5 rounded-2xl text-sm whitespace-pre-wrap leading-relaxed ${
                        m.role === 'user'
                          ? 'bg-indigo-600 text-white'
                          : 'bg-white border border-gray-200 text-gray-700'
                      }`}>
                        {m.content}
                      </div>
                    </div>
                  </div>
                );
              })}

              {/* Typing indicator */}
              {thinking && (
                <div className="flex justify-start">
                  <div className="bg-white border border-gray-200 text-gray-400 px-4 py-2.5 rounded-2xl text-sm flex items-center gap-1">
                    <span className="animate-pulse">●</span>
                    <span className="animate-pulse" style={{ animationDelay: '0.15s' }}>●</span>
                    <span className="animate-pulse" style={{ animationDelay: '0.3s' }}>●</span>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Input bar */}
          <div className="px-4 py-3 flex gap-2 items-center">
            <input
              value={input} onChange={e => onChange(e.target.value)} onKeyDown={handleKey}
              placeholder="Ask Andy anything…" disabled={thinking}
              className="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 disabled:bg-gray-50"
            />
            <button onClick={onSend} disabled={thinking || !input.trim()}
              className="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-colors shrink-0">
              Send
            </button>
          </div>
        </div>
      );
    }

    // ─── Dashboard Sub-components ─────────────────────────────────────────────────
    function DashStatCard({ icon, label, value, color, onClick }) {
      return (
        <div onClick={onClick}
          className={`rounded-xl p-4 transition-transform ${onClick ? 'cursor-pointer hover:scale-[1.02]' : ''} ${color}`}>
          <div className="text-xl mb-1">{icon}</div>
          <div className="text-2xl font-bold">{value}</div>
          <div className="text-[11px] font-medium opacity-70 mt-0.5 uppercase tracking-wide">{label}</div>
        </div>
      );
    }

    function Top3Panel({ tasks, onRefresh }) {
      const top3 = tasks.slice(0, 3);
      if (!top3.length) return null;
      return (
        <Card className="p-4">
          <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Top 3 Priorities</h3>
          <div className="space-y-2.5">
            {top3.map((t, i) => (
              <div key={t.id} className="flex items-center gap-2">
                <span className="text-xs font-bold text-gray-300 w-4 shrink-0">{i + 1}</span>
                <PriorityDot priority={t.priority} />
                <span className="flex-1 text-sm text-gray-800 truncate">{t.title}</span>
                {t.dueDate && (
                  <span className={`text-xs px-1.5 py-0.5 rounded font-medium shrink-0 ${DS.daysUntil(t.dueDate) < 0 ? 'text-red-600 bg-red-50' : 'text-gray-400 bg-gray-50'}`}>
                    {fmtDate(t.dueDate)}
                  </span>
                )}
                <button onClick={() => { DS.tasks.complete(t.id); onRefresh(); }}
                  className="text-xs px-2 py-1 rounded-lg bg-gray-100 hover:bg-emerald-100 hover:text-emerald-700 text-gray-500 transition-colors shrink-0">
                  Done
                </button>
              </div>
            ))}
          </div>
        </Card>
      );
    }

    function UpcomingDeadlinesPanel({ deadlines, onNav }) {
      const upcoming = deadlines
        .filter(d => d.status !== 'done')
        .filter(d => DS.daysUntil(d.dueDate) <= 60)
        .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))
        .slice(0, 5);
      if (!upcoming.length) return null;
      return (
        <Card className="p-4">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Upcoming Deadlines</h3>
            <button onClick={() => onNav('deadlines')} className="text-xs text-indigo-500 hover:text-indigo-700">View all →</button>
          </div>
          <div className="space-y-2">
            {upcoming.map(d => {
              const days = DS.daysUntil(d.dueDate);
              return (
                <div key={d.id} className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="text-[10px] text-gray-400 uppercase shrink-0 bg-gray-100 px-1.5 py-0.5 rounded">{d.category}</span>
                    <span className="text-sm text-gray-700 truncate">{d.title}</span>
                  </div>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-medium shrink-0 ${days < 0 ? 'bg-red-100 text-red-600' : days <= 7 ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-500'}`}>
                    {days < 0 ? `${Math.abs(days)}d overdue` : days === 0 ? 'Today' : `${days}d`}
                  </span>
                </div>
              );
            })}
          </div>
        </Card>
      );
    }

    function FamilyBoardPanel({ family, onNav }) {
      if (!family.length) return null;
      return (
        <Card className="p-4">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Family Board</h3>
            <button onClick={() => onNav('family')} className="text-xs text-indigo-500 hover:text-indigo-700">View all →</button>
          </div>
          <div className="grid grid-cols-2 gap-2">
            {family.map(m => {
              const assigned = (m.assignments || []).filter(a => a.status !== 'done').length;
              return (
                <div key={m.id} className="flex items-center gap-2 p-2 rounded-lg bg-gray-50">
                  <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm font-bold shrink-0">
                    {m.name[0]}
                  </div>
                  <div className="min-w-0">
                    <div className="text-sm font-medium text-gray-800 truncate">{m.name}</div>
                    <div className="text-xs text-gray-400">{assigned ? `${assigned} task${assigned !== 1 ? 's' : ''}` : 'No tasks'}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      );
    }

    function HabitStreakPanel({ habits, onNav }) {
      if (!habits.length) return null;
      const today = DS.todayISO();
      const days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(today + 'T12:00:00');
        d.setDate(d.getDate() - (6 - i));
        return d.toISOString().split('T')[0];
      });
      return (
        <Card className="p-4">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Habit Streaks (7d)</h3>
            <button onClick={() => onNav('habits')} className="text-xs text-indigo-500 hover:text-indigo-700">View all →</button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead>
                <tr>
                  <th className="text-left text-gray-400 font-normal pb-2 pr-3 whitespace-nowrap">Habit</th>
                  {days.map(d => (
                    <th key={d} className="text-center text-gray-400 font-normal pb-2 px-0.5 w-7">
                      {new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'narrow' })}
                    </th>
                  ))}
                  <th className="text-right text-gray-400 font-normal pb-2 pl-2">🔥</th>

              </thead>
              <tbody>
                {habits.map(h => (
                  <tr key={h.id}>
                    <td className="text-gray-700 pr-3 py-1 whitespace-nowrap" style={{ maxWidth: '120px', overflow: 'hidden', textOverflow: 'ellipsis' }}>{h.name}</td>
                    {days.map(d => {
                      const done = (h.log || []).some(e => e.date === d && e.done);
                      return (
                        <td key={d} className="text-center py-1 px-0.5">
                          <span className={`inline-flex w-5 h-5 rounded-full text-[10px] items-center justify-center ${done ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-300'}`}>
                            {done ? '✓' : '·'}
                          </span>

                    })}
                    <td className="text-right text-orange-500 font-bold pl-2 py-1">{h.currentStreak || 0}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      );
    }

    // ─── Insights Card ───────────────────────────────────────────────────────────
    function InsightsCard({ insights, loading, onDismiss, onApply, onRunAnalysis }) {
      const urgencyColors = {
        high:   'bg-red-50 border-red-200 text-red-700',
        medium: 'bg-amber-50 border-amber-200 text-amber-700',
        low:    'bg-blue-50 border-blue-200 text-blue-600',
      };
      const urgencyIcons = { high: '🔴', medium: '🟡', low: '🟢' };

      if (loading) return (

    // ─── Deadlines ────────────────────────────────────────────────────────────────
    const DL_CATEGORIES = ['school','legal','license','insurance','registration','medical','financial','other'];
    const ALERT_DAY_OPTIONS = [90, 60, 30, 14, 7, 3, 1];

    function rowColor(days, status) {
      if (status === 'done')    return 'bg-gray-50 opacity-60';
      if (status === 'overdue') return 'bg-red-50';
      if (days < 7)   return 'bg-red-50';
      if (days < 30)  return 'bg-orange-50';
      if (days < 60)  return 'bg-yellow-50';
      return '';
    }

    function daysChip(days, status) {
      if (status === 'done')    return { label: 'Done',                      cls: 'bg-gray-100 text-gray-500' };
      if (status === 'overdue') return { label: `${Math.abs(days)}d overdue`, cls: 'bg-red-100 text-red-600' };
      if (days === 0)           return { label: 'Today!',                    cls: 'bg-red-100 text-red-600 animate-pulse' };
      if (days < 7)             return { label: `${days}d`,                  cls: 'bg-red-100 text-red-600' };
      if (days < 30)            return { label: `${days}d`,                  cls: 'bg-orange-100 text-orange-600' };
      if (days < 60)            return { label: `${days}d`,                  cls: 'bg-yellow-100 text-yellow-700' };
      return                           { label: `${days}d`,                  cls: 'bg-green-100 text-green-700' };
    }

    // Deferral flame with lazy AI context
    function DeferralFlame({ deadline, apiKey }) {
      const count = deadline.deferralCount || 0;
      const [open, setOpen] = useState(false);
      const [context, setContext] = useState(null);
      const [loading, setLoading] = useState(false);

      const load = async () => {
        if (context || loading) { setOpen(o => !o); return; }
        setOpen(true);
        setLoading(true);
        try {
          const text = await CS.callLLM(
            'You are a sharp life coach. In 1-2 short sentences explain why NOT completing this deadline matters — the real cost of continued delay. Be specific, direct, no fluff.',
            `Deadline: "${deadline.title}" (${deadline.category || 'personal'}), deferred ${count} times.`,
            80
          );
          setContext(text);
        } catch (_) {
          setContext('Continued delays compound — this one matters.');
        }
        setLoading(false);
      };

      return (
        <span className="relative inline-block">
          <button onClick={load} title={`Deferred ${count}× — click to see why this matters`}
            className="text-orange-500 hover:text-orange-600 text-base leading-none cursor-pointer">
            🔥
          </button>
          {open && (
            <div className="absolute z-20 bottom-full left-1/2 -translate-x-1/2 mb-2 w-56 bg-gray-900 text-white text-xs rounded-xl p-3 shadow-xl">
              <div className="font-semibold text-orange-300 mb-1">Deferred {count}× — why it matters</div>
              {loading
                ? <span className="opacity-60">Loading…</span>
                : <span className="leading-relaxed">{context}</span>}
              <button onClick={() => setOpen(false)} className="absolute top-1 right-2 text-gray-400 hover:text-white text-sm">×</button>
            </div>
          )}
        </span>
      );
    }

      const family = DS.family.list();

      const all = DS.deadlines.list().sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
      const shown = filter === 'active' ? all.filter(d => d.status !== 'done')
                  : filter === 'done'   ? all.filter(d => d.status === 'done')
                  : all;

      const handleSave = form => {
        DS.deadlines.create(form);
        setShowAdd(false);
        onRefresh();
      };

      const handleDone = id => { DS.deadlines.markDone(id); onRefresh(); };

      const handleSnooze = (deadline, newDate) => {
        const count = (deadline.deferralCount || 0) + 1;
        DS.deadlines.update(deadline.id, { dueDate: newDate, status: 'pending', deferralCount: count });

        setSnoozing(null);
        onRefresh();

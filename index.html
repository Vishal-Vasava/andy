      const handleDelete = id => { DS.deadlines.delete(id); onRefresh(); };

      const getMemberName = assignedTo => {
        if (!assignedTo || assignedTo === 'self') return 'Self';
        const m = family.find(m => m.id === assignedTo);
        return m ? m.name : assignedTo;
      };

      return (
        <div className="p-5">
          {showAdd && (
            <AddDeadlineModal
              familyMembers={family}
              onSave={handleSave}
              onClose={() => setShowAdd(false)}
            />
          )}
          {snoozing && (
            <SnoozeModal
              deadline={snoozing}
              onSave={d => handleSnooze(snoozing, d)}
              onClose={() => setSnoozing(null)}
            />
          )}

          {/* Header */}
          <div className="flex items-center justify-between mb-4 gap-3">
            <div className="flex gap-1 bg-gray-100 p-1 rounded-xl">
              {['active', 'done', 'all'].map(f => (
                <button key={f} onClick={() => setFilter(f)}
                  className={`px-3 py-1 rounded-lg text-xs font-medium transition-colors capitalize ${filter === f ? 'bg-white shadow text-indigo-600' : 'text-gray-500 hover:text-gray-700'}`}>
                  {f}
                </button>
              ))}
            </div>
            <button onClick={() => setShowAdd(true)}
              className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition-colors flex items-center gap-1.5">
              + Deadline
            </button>
          </div>

          {/* Color legend */}
          <div className="flex gap-3 mb-4 text-xs text-gray-500 flex-wrap">
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-red-200 inline-block" /> &lt;7d</span>
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-orange-200 inline-block" /> 7–30d</span>
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-yellow-200 inline-block" /> 30–60d</span>
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-green-200 inline-block" /> &gt;60d</span>
          </div>

          {shown.length === 0 && <EmptyState icon="📅" text={filter === 'done' ? 'No completed deadlines.' : 'No deadlines. Add one!'} />}

          {/* Table */}
          {shown.length > 0 && (
            <div className="rounded-xl border border-gray-200 overflow-hidden">
              <table className="w-full text-sm">
                <thead className="bg-gray-50 border-b border-gray-200">
                  <tr>
                    <th className="text-left text-xs font-semibold text-gray-500 uppercase tracking-wide px-4 py-3">Title</th>
                    <th className="text-left text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-3 hidden sm:table-cell">Category</th>
                    <th className="text-left text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-3 hidden md:table-cell">Due Date</th>
                    <th className="text-center text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-3">Days Left</th>
                    <th className="text-center text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-3 hidden sm:table-cell">Assigned</th>
                    <th className="text-center text-xs font-semibold text-gray-500 uppercase tracking-wide px-3 py-3">Status</th>
                    <th className="text-right text-xs font-semibold text-gray-500 uppercase tracking-wide px-4 py-3">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {shown.map(d => {
                    const days = DS.daysUntil(d.dueDate);
                    const chip = daysChip(days, d.status);
                    const deferred = (d.deferralCount || 0) >= 3;
                    return (
                      <tr key={d.id} className={`transition-colors hover:brightness-95 ${rowColor(days, d.status)}`}>
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-2">
                            {deferred && <DeferralFlame deadline={d} apiKey={apiKey} />}
                            <div>
                              <div className="font-medium text-gray-800 leading-tight">{d.title}</div>
                              {d.notes && <div className="text-xs text-gray-400 mt-0.5 max-w-[200px] truncate">{d.notes}</div>}
                            </div>
                          </div>
                        </td>
                        <td className="px-3 py-3 hidden sm:table-cell">
                          <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full capitalize">{d.category || '—'}</span>
                        </td>
                        <td className="px-3 py-3 text-gray-500 hidden md:table-cell whitespace-nowrap">{fmtDate(d.dueDate)}</td>
                        <td className="px-3 py-3 text-center">
                          <span className={`text-xs px-2.5 py-1 rounded-full font-semibold whitespace-nowrap ${chip.cls}`}>{chip.label}</span>
                        </td>
                        <td className="px-3 py-3 text-center text-xs text-gray-500 hidden sm:table-cell">{getMemberName(d.assignedTo)}</td>
                        <td className="px-3 py-3 text-center">
                          <span className={`text-xs px-2 py-0.5 rounded-full font-medium capitalize ${
                            d.status === 'done'    ? 'bg-gray-100 text-gray-400' :
                            d.status === 'overdue' ? 'bg-red-100 text-red-600' :
                            d.status === 'snoozed' ? 'bg-amber-100 text-amber-600' :
                            'bg-indigo-50 text-indigo-600'
                          }`}>{d.status}</span>
                        </td>
                        <td className="px-4 py-3">
                          <div className="flex items-center justify-end gap-1.5">
                            {d.status !== 'done' && (
                              <>
                                <button onClick={() => handleDone(d.id)}
                                  className="text-xs px-2.5 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-medium transition-colors">
                                  ✓ Done
                                </button>
                                <button onClick={() => setSnoozing(d)}
                                  className="text-xs px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-700 font-medium transition-colors">
                                  ⏰ Snooze
                                </button>
                              </>
                            )}
                            <button onClick={() => handleDelete(d.id)}
                              className="text-xs px-2 py-1 rounded-lg hover:bg-red-50 text-gray-300 hover:text-red-400 transition-colors">
                              ✕
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ─── Family ───────────────────────────────────────────────────────────────────
    const FAMILY_COLORS = [
      { bg:'bg-indigo-100', text:'text-indigo-700', dot:'bg-indigo-400', border:'border-l-indigo-400' },
      { bg:'bg-emerald-100', text:'text-emerald-700', dot:'bg-emerald-400', border:'border-l-emerald-400' },
      { bg:'bg-rose-100', text:'text-rose-700', dot:'bg-rose-400', border:'border-l-rose-400' },
      { bg:'bg-amber-100', text:'text-amber-700', dot:'bg-amber-400', border:'border-l-amber-400' },
      { bg:'bg-violet-100', text:'text-violet-700', dot:'bg-violet-400', border:'border-l-violet-400' },
      { bg:'bg-cyan-100', text:'text-cyan-700', dot:'bg-cyan-400', border:'border-l-cyan-400' },
    ];

    function relIcon(rel) {
      const map = { son:'👦', daughter:'👧', spouse:'💑', parent:'👴', self:'🧑', other:'👤' };
      return map[rel] || '👤';
    }

    function taskKanbanStatus(task) {
      if (task.completedAt) return 'done';
      const today = DS.todayISO();
      if (task.dueDate && task.dueDate < today) return 'overdue';
      if (task.dueDate && DS.daysUntil(task.dueDate) <= 7) return 'inprogress';
      return 'todo';
    }

    // ── AddMemberModal ──────────────────────────────────────────────────────────
    function AddMemberModal({ onSave, onClose }) {
      const [form, setForm] = useState({ name:'', age:'', relationship:'son', role:'dependent' });
      const f = v => setForm(p => ({ ...p, ...v }));
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4 relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-xl">×</button>
            <h2 className="text-lg font-bold text-gray-800">Add Family Member</h2>

            <div>
              <label className="block text-xs font-medium text-gray-500 mb-1">Name *</label>
              <input value={form.name} onChange={e => f({ name: e.target.value })} autoFocus
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                placeholder="e.g. Sarah" />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-medium text-gray-500 mb-1">Age</label>
                <input type="number" min="0" max="120" value={form.age} onChange={e => f({ age: e.target.value })}
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" placeholder="e.g. 12" />
              </div>
              <div>
                <label className="block text-xs font-medium text-gray-500 mb-1">Relationship</label>
                <select value={form.relationship} onChange={e => f({ relationship: e.target.value })}
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
                  {['son','daughter','spouse','parent','other'].map(r => (
                    <option key={r} value={r}>{r.charAt(0).toUpperCase()+r.slice(1)}</option>
                  ))}
                </select>
              </div>
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-500 mb-2">Role</label>
              <div className="flex gap-2">
                {[['dependent','👶 Dependent'],['self','🧑 Self/Adult']].map(([val, lbl]) => (
                  <button key={val} onClick={() => f({ role: val })}
                    className={`flex-1 py-2.5 rounded-xl text-sm font-medium border transition-colors ${form.role === val ? 'bg-indigo-600 text-white border-indigo-600' : 'border-gray-200 text-gray-600 hover:border-indigo-300'}`}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex gap-2 pt-1">
              <button onClick={() => form.name.trim() && onSave(form)} disabled={!form.name.trim()}
                className="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white text-sm font-medium py-2.5 rounded-xl transition-colors">
                Add Member
              </button>
              <button onClick={onClose} className="px-5 py-2.5 text-sm text-gray-500 hover:bg-gray-50 rounded-xl transition-colors">Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    // ── AssignTaskModal ─────────────────────────────────────────────────────────
    function AssignTaskModal({ member, colorEntry, onSave, onClose }) {
      const [form, setForm] = useState({ title:'', dueDate:'', priority:'P2', reminderDays:[3,1], notes:'' });
      const f = v => setForm(p => ({ ...p, ...v }));
      const toggleR = d => f({ reminderDays: form.reminderDays.includes(d) ? form.reminderDays.filter(x=>x!==d) : [...form.reminderDays,d] });
      const isMinor = member.role === 'dependent' || (member.age && parseInt(member.age) < 18);
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4 relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-xl">×</button>
            <div className="flex items-center gap-3">
              <div className={`w-9 h-9 rounded-full ${colorEntry.bg} flex items-center justify-center text-lg`}>{relIcon(member.relationship)}</div>
              <div>
                <h2 className="text-base font-bold text-gray-800">Assign Task</h2>
                <p className="text-xs text-gray-400">to {member.name}</p>
              </div>
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-500 mb-1">Task Title *</label>
              <input value={form.title} onChange={e => f({ title: e.target.value })} autoFocus
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                placeholder="e.g. Complete math homework" />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-medium text-gray-500 mb-1">Due Date</label>
                <input type="date" value={form.dueDate} onChange={e => f({ dueDate: e.target.value })}
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
              </div>
              <div>
                <label className="block text-xs font-medium text-gray-500 mb-1">Priority</label>
                <select value={form.priority} onChange={e => f({ priority: e.target.value })}
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
                  {[['P0','Urgent'],['P1','High'],['P2','Normal'],['P3','Low']].map(([v,l]) => (
                    <option key={v} value={v}>{v} — {l}</option>
                  ))}
                </select>
              </div>
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-500 mb-2">
                Remind before due
                {isMinor && <span className="ml-1 text-amber-500">— auto-escalates to parent</span>}
              </label>
              <div className="flex flex-wrap gap-2">
                {[[7,'7d'],[3,'3d'],[1,'1d'],[0,'Day of']].map(([d,lbl]) => (
                  <button key={d} onClick={() => toggleR(d)}
                    className={`px-3 py-1 rounded-full text-xs font-medium border transition-colors ${form.reminderDays.includes(d) ? 'bg-indigo-600 text-white border-indigo-600' : 'border-gray-200 text-gray-500 hover:border-indigo-300'}`}>
                    {lbl}
                  </button>
                ))}
              </div>
              {isMinor && (
                <p className="text-xs text-amber-600 mt-1.5 flex items-center gap-1">
                  ⚠️ Parent backup alert will be set at 3d + 1d before due.
                </p>
              )}
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-500 mb-1">Notes</label>
              <textarea value={form.notes} onChange={e => f({ notes: e.target.value })} rows={2}
                className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
            </div>

            <div className="flex gap-2 pt-1">
              <button onClick={() => form.title.trim() && onSave(form)} disabled={!form.title.trim()}
                className="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white text-sm font-medium py-2.5 rounded-xl transition-colors">
                Assign Task
              </button>
              <button onClick={onClose} className="px-5 py-2.5 text-sm text-gray-500 hover:bg-gray-50 rounded-xl transition-colors">Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    // ── TaskDetailModal ─────────────────────────────────────────────────────────
    function TaskDetailModal({ task, member, colorEntry, onMarkDone, onDefer, onClose }) {
      const days = task.dueDate ? DS.daysUntil(task.dueDate) : null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 space-y-4 relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-xl">×</button>
            {member && (
              <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium ${colorEntry.bg} ${colorEntry.text}`}>
                <span>{relIcon(member.relationship)}</span><span>{member.name}</span>
              </span>
            )}
            <div>
              <h3 className="text-base font-bold text-gray-800">{task.title}</h3>
              {task.notes && <p className="text-sm text-gray-500 mt-1">{task.notes}</p>}
            </div>
            <div className="grid grid-cols-2 gap-3 text-xs">
              {task.dueDate && (
                <div>
                  <div className="text-gray-400 uppercase tracking-wide font-medium mb-0.5">Due</div>
                  <div className={`font-semibold ${days < 0 ? 'text-red-500' : days <= 3 ? 'text-amber-500' : 'text-gray-700'}`}>
                    {fmtDate(task.dueDate)}<br/>
                    <span className="font-normal text-gray-400">{days < 0 ? `${Math.abs(days)}d overdue` : days === 0 ? 'Today' : `${days}d left`}</span>
                  </div>
                </div>
              )}
              <div>
                <div className="text-gray-400 uppercase tracking-wide font-medium mb-0.5">Priority</div>
                <div className="font-semibold text-gray-700">{task.priority}</div>
              </div>
              {(task.deferralCount||0) > 0 && (
                <div>
                  <div className="text-gray-400 uppercase tracking-wide font-medium mb-0.5">Deferred</div>
                  <div className="font-semibold text-orange-500">{task.deferralCount}×</div>
                </div>
              )}
            </div>
            {!task.completedAt && (
              <div className="flex gap-2 pt-1">
                <button onClick={onMarkDone} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2.5 rounded-xl transition-colors">✓ Mark Done</button>
                {task.dueDate && (
                  <button onClick={onDefer} className="px-4 py-2.5 text-sm text-amber-600 bg-amber-50 hover:bg-amber-100 rounded-xl transition-colors">⏭ +3d</button>
                )}
              </div>
            )}
            {task.completedAt && (
              <div className="text-xs text-gray-400 text-center bg-gray-50 rounded-xl py-3">
                ✅ Completed {fmtDate(task.completedAt.split('T')[0])}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── KanbanCard ──────────────────────────────────────────────────────────────
    function KanbanCard({ task, member, colorEntry, onClick }) {
      const days  = task.dueDate ? DS.daysUntil(task.dueDate) : null;
      const defer = task.deferralCount || 0;
      return (
        <div onClick={onClick}
          className={`bg-white rounded-xl border border-gray-100 border-l-4 ${colorEntry.border} p-3 cursor-pointer hover:shadow-md transition-shadow`}>
          <div className="text-sm font-medium text-gray-800 leading-tight flex items-start gap-1">
            {defer >= 3 && <span className="text-orange-400 shrink-0" title={`Deferred ${defer}×`}>🔥</span>}
            <span>{task.title}</span>
          </div>
          <div className="flex items-center justify-between mt-2 gap-1 flex-wrap">
            <span className={`flex items-center gap-1 text-[11px] px-1.5 py-0.5 rounded-full font-medium ${colorEntry.bg} ${colorEntry.text}`}>
              <span>{relIcon(member?.relationship)}</span>
              <span className="max-w-[52px] truncate">{member?.name || '?'}</span>
            </span>
            {task.dueDate && (
              <span className={`text-[11px] px-1.5 py-0.5 rounded-full font-medium ${days < 0 ? 'bg-red-100 text-red-600' : days === 0 ? 'bg-amber-100 text-amber-600' : days <= 3 ? 'bg-orange-100 text-orange-600' : 'bg-gray-100 text-gray-500'}`}>
                {days < 0 ? `${Math.abs(days)}d late` : days === 0 ? 'Today' : `${days}d`}
              </span>
            )}
          </div>
          {defer > 0 && <div className="text-[10px] text-gray-400 mt-1.5">Deferred {defer}×</div>}
        </div>
      );
    }

    // ── KanbanColumn ────────────────────────────────────────────────────────────
    function KanbanColumn({ title, statusIcon, tasks, members, colorMap, accentClass, onCardClick }) {
      return (
        <div className="flex-1 min-w-[170px] flex flex-col">
          <div className={`flex items-center gap-1.5 px-3 py-2 rounded-t-xl ${accentClass}`}>
            <span className="text-sm">{statusIcon}</span>
            <span className="text-xs font-bold uppercase tracking-wide text-gray-600 flex-1">{title}</span>
            <span className="text-xs bg-white/70 text-gray-500 px-1.5 py-0.5 rounded-full font-semibold">{tasks.length}</span>
          </div>
          <div className="flex-1 bg-gray-50/70 rounded-b-xl p-2 space-y-2 min-h-[150px] overflow-y-auto">
            {tasks.map(t => {
              const member = members.find(m => m.id === t.assignedTo);
              const colorEntry = colorMap[t.assignedTo] || FAMILY_COLORS[0];
              return <KanbanCard key={t.id} task={t} member={member} colorEntry={colorEntry} onClick={() => onCardClick(t)} />;
            })}
            {tasks.length === 0 && <div className="text-xs text-gray-300 text-center py-8">Empty</div>}
          </div>
        </div>
      );
    }

    // ── WeeklyCalendar ──────────────────────────────────────────────────────────
    function WeeklyCalendar({ members, colorMap, onTaskClick }) {
      const today = DS.todayISO();
      const todayD = new Date(today + 'T12:00:00');
      const dow = todayD.getDay(); // 0=Sun
      const weekStart = new Date(todayD);
      weekStart.setDate(todayD.getDate() - (dow === 0 ? 6 : dow - 1));

      const days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(weekStart);
        d.setDate(weekStart.getDate() + i);
        return d.toISOString().split('T')[0];
      });

      const allTasks = DS.tasks.listOpen();
      const DAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

      return (
        <div>
          <div className="grid grid-cols-7 gap-1.5">
            {days.map((d, i) => {
              const isToday = d === today;
              const dayTasks = allTasks.filter(t => t.dueDate === d && t.assignedTo && members.some(m => m.id === t.assignedTo));
              return (
                <div key={d} className={`rounded-xl border overflow-hidden ${isToday ? 'border-indigo-300 shadow-sm' : 'border-gray-100'}`}>
                  <div className={`text-center py-2 border-b ${isToday ? 'bg-indigo-600 border-indigo-600' : 'bg-gray-50 border-gray-100'}`}>
                    <div className={`text-[11px] font-semibold ${isToday ? 'text-indigo-200' : 'text-gray-400'}`}>{DAY_LABELS[i]}</div>
                    <div className={`text-base font-bold ${isToday ? 'text-white' : 'text-gray-700'}`}>{new Date(d+'T12:00:00').getDate()}</div>
                    {isToday && <div className="text-[9px] text-indigo-200 uppercase tracking-wider font-bold">Today</div>}
                  </div>
                  <div className="p-1.5 space-y-1 min-h-[90px] bg-white">
                    {dayTasks.map(t => {
                      const ce = colorMap[t.assignedTo] || FAMILY_COLORS[0];
                      return (
                        <div key={t.id} onClick={() => onTaskClick(t)}
                          className={`rounded-lg px-2 py-1.5 cursor-pointer hover:opacity-80 transition-opacity ${ce.bg}`}>
                          <div className={`text-[11px] font-medium truncate ${ce.text}`}>{t.title}</div>
                        </div>
                      );
                    })}
                    {dayTasks.length === 0 && <div className="text-[10px] text-gray-200 text-center pt-4">—</div>}
                  </div>
                </div>
              );
            })}
          </div>
          {/* Legend */}
          <div className="flex flex-wrap gap-4 mt-3 px-1">
            {members.map(m => {
              const ce = colorMap[m.id] || FAMILY_COLORS[0];
              return (
                <div key={m.id} className="flex items-center gap-1.5">
                  <span className={`w-2.5 h-2.5 rounded-full ${ce.dot}`} />
                  <span className="text-xs text-gray-500">{m.name}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ── FamilyView (main) ───────────────────────────────────────────────────────
    function FamilyView({ tick, onRefresh }) {
      const [viewMode, setViewMode]     = useState('board'); // 'board'|'calendar'
      const [selectedId, setSelectedId] = useState(null);
      const [showAdd, setShowAdd]       = useState(false);
      const [assigningTo, setAssigningTo] = useState(null);  // member record
      const [taskDetail, setTaskDetail]   = useState(null);  // { task, member, colorEntry }

      const members = DS.family.list();
      const colorMap = {};
      members.forEach((m, i) => { colorMap[m.id] = FAMILY_COLORS[i % FAMILY_COLORS.length]; });

      const handleAddMember = form => {
        DS.family.create({ name: form.name, age: form.age ? parseInt(form.age) : null, relationship: form.relationship, role: form.role });
        setShowAdd(false); onRefresh();
      };

      const handleAssignTask = (member, form) => {
        const isMinor = member.role === 'dependent' || (member.age && parseInt(member.age) < 18);
        const task = DS.tasks.create({ title: form.title, dueDate: form.dueDate || null, priority: form.priority, assignedTo: member.id, notes: form.notes });
        DS.family.assignTask(member.id, task.id, 'pending', form.dueDate || null);
        // For minors: create a deadline to wire parent backup alerts into the existing alert engine
        if (isMinor && form.dueDate) {
          DS.deadlines.create({ title: `[${member.name}] ${form.title}`, category: 'other', dueDate: form.dueDate, alertDays: form.reminderDays.length ? form.reminderDays : [3, 1], assignedTo: member.id, notes: `Parent backup — ${member.name}'s task` });
        }
        DS.activity.log('task_assigned', `Assigned "${form.title}" to ${member.name}`, { taskId: task.id, memberId: member.id });
        setAssigningTo(null); onRefresh();
      };

      const handleMarkDone = task => {
        DS.tasks.complete(task.id);
        if (task.assignedTo) DS.family.updateTaskStatus(task.assignedTo, task.id, 'done');
        setTaskDetail(null); onRefresh();
      };

      const handleDefer = task => {
        DS.tasks.defer(task.id, addDays(task.dueDate || DS.todayISO(), 3));
        setTaskDetail(null); onRefresh();
      };

      const openDetail = task => {
        const member = members.find(m => m.id === task.assignedTo);
        setTaskDetail({ task, member, colorEntry: colorMap[task.assignedTo] || FAMILY_COLORS[0] });
      };

      const familyTasks = DS.tasks.list().filter(t => t.assignedTo && members.some(m => m.id === t.assignedTo));
      const filtered    = selectedId ? familyTasks.filter(t => t.assignedTo === selectedId) : familyTasks;

      const buckets = {
        todo:       filtered.filter(t => taskKanbanStatus(t) === 'todo'),
        inprogress: filtered.filter(t => taskKanbanStatus(t) === 'inprogress'),
        done:       filtered.filter(t => taskKanbanStatus(t) === 'done').slice(0, 10),
        overdue:    filtered.filter(t => taskKanbanStatus(t) === 'overdue'),
      };

      const selectedMember = selectedId ? members.find(m => m.id === selectedId) : null;

      return (
        <div className="flex overflow-hidden" style={{ height: 'calc(100vh - 120px)' }}>

          {/* Left panel — member list */}
          <div className="w-52 shrink-0 border-r border-gray-100 bg-white flex flex-col overflow-y-auto">
            <div className="flex items-center justify-between px-4 py-3 border-b border-gray-100">
              <span className="text-xs font-bold text-gray-500 uppercase tracking-wider">Members</span>
              <button onClick={() => setShowAdd(true)}
                className="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-base leading-none hover:bg-indigo-200 transition-colors">+</button>
            </div>
            <div className="p-2 space-y-1">
              {/* All filter */}
              <button onClick={() => setSelectedId(null)}
                className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm transition-colors ${selectedId === null ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
                <span className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-base shrink-0">👥</span>
                <span className="text-sm">All</span>
              </button>

              {members.map((m, i) => {
                const ce = FAMILY_COLORS[i % FAMILY_COLORS.length];
                const openCount = familyTasks.filter(t => t.assignedTo === m.id && !t.completedAt).length;
                const isSelected = selectedId === m.id;
                return (
                  <div key={m.id} className="relative group">
                    <button onClick={() => setSelectedId(isSelected ? null : m.id)}
                      className={`w-full flex items-start gap-2.5 px-3 py-2.5 rounded-xl transition-colors text-left ${isSelected ? `${ce.bg}` : 'hover:bg-gray-50'}`}>
                      <div className={`w-8 h-8 rounded-full ${ce.bg} flex items-center justify-center text-sm font-bold ${ce.text} shrink-0`}>{m.name[0]}</div>
                      <div className="flex-1 min-w-0">
                        <div className={`text-sm font-medium truncate ${isSelected ? ce.text : 'text-gray-800'}`}>{m.name}</div>
                        <div className="text-[11px] text-gray-400 capitalize">{m.relationship}{m.age ? ` · ${m.age}y` : ''}</div>
                        {openCount > 0 && <div className={`text-[10px] font-bold mt-0.5 ${ce.text}`}>{openCount} open</div>}
                      </div>
                    </button>
                    {/* Assign task quick-button */}
                    <button onClick={() => setAssigningTo(m)}
                      title={`Assign task to ${m.name}`}
                      className={`absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold opacity-0 group-hover:opacity-100 transition-opacity ${ce.bg} ${ce.text}`}>
                      +
                    </button>
                  </div>
                );
              })}

              {members.length === 0 && (
                <div className="text-xs text-gray-400 text-center py-6 px-2">
                  No members yet.<br />Click + to add.
                </div>
              )}
            </div>
          </div>

          {/* Right panel */}
          <div className="flex-1 min-w-0 flex flex-col overflow-hidden bg-gray-50/50">
            {/* Toolbar */}
            <div className="flex items-center justify-between px-4 py-2.5 border-b border-gray-100 bg-white shrink-0 gap-3">
              <div className="flex items-center gap-2">
                {selectedMember && (() => {
                  const ce = colorMap[selectedId] || FAMILY_COLORS[0];
                  return (
                    <span className={`flex items-center gap-1.5 text-xs font-medium px-3 py-1 rounded-full ${ce.bg} ${ce.text}`}>
                      <span>{relIcon(selectedMember.relationship)}</span>
                      <span>{selectedMember.name}</span>
                    </span>
                  );
                })()}
                {selectedMember && (
                  <button onClick={() => setAssigningTo(selectedMember)}
                    className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-full transition-colors">
                    + Assign Task
                  </button>
                )}
                {!selectedMember && members.length > 0 && (
                  <span className="text-xs text-gray-400">
                    {familyTasks.filter(t => !t.completedAt).length} open tasks across all members
                  </span>
                )}
              </div>
              <div className="flex gap-1 bg-gray-100 p-1 rounded-xl shrink-0">
                {[['board','📋 Board'],['calendar','📅 Week']].map(([mode, lbl]) => (
                  <button key={mode} onClick={() => setViewMode(mode)}
                    className={`px-3 py-1 rounded-lg text-xs font-medium transition-colors ${viewMode === mode ? 'bg-white shadow text-indigo-600' : 'text-gray-500 hover:text-gray-700'}`}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>

            {/* Main content area */}
            <div className="flex-1 overflow-auto p-4">
              {members.length === 0 ? (
                <EmptyState icon="👨‍👩‍👧" text="Add a family member using the panel on the left to get started." />
              ) : viewMode === 'board' ? (
                <div className="flex gap-3 h-full">
                  <KanbanColumn title="To Do"      statusIcon="📋" tasks={buckets.todo}       members={members} colorMap={colorMap} accentClass="bg-gray-100"    onCardClick={openDetail} />
                  <KanbanColumn title="Due Soon"   statusIcon="⏳" tasks={buckets.inprogress} members={members} colorMap={colorMap} accentClass="bg-blue-50"     onCardClick={openDetail} />
                  <KanbanColumn title="Done"       statusIcon="✅" tasks={buckets.done}       members={members} colorMap={colorMap} accentClass="bg-emerald-50"  onCardClick={openDetail} />
                  <KanbanColumn title="Overdue"    statusIcon="🔴" tasks={buckets.overdue}    members={members} colorMap={colorMap} accentClass="bg-red-50"      onCardClick={openDetail} />
                </div>
              ) : (
                <WeeklyCalendar members={members} colorMap={colorMap} onTaskClick={openDetail} />
              )}
            </div>
          </div>

          {/* Modals */}
          {showAdd      && <AddMemberModal onSave={handleAddMember} onClose={() => setShowAdd(false)} />}
          {assigningTo  && (
            <AssignTaskModal
              member={assigningTo}
              colorEntry={colorMap[assigningTo.id] || FAMILY_COLORS[0]}
              onSave={form => handleAssignTask(assigningTo, form)}
              onClose={() => setAssigningTo(null)}
            />
          )}
          {taskDetail && (
            <TaskDetailModal
              task={taskDetail.task}
              member={taskDetail.member}
              colorEntry={taskDetail.colorEntry}
              onMarkDone={() => handleMarkDone(taskDetail.task)}
              onDefer={() => handleDefer(taskDetail.task)}
              onClose={() => setTaskDetail(null)}
            />
          )}
        </div>
      );
    }

    // ─── Habits ───────────────────────────────────────────────────────────────────
    const HABIT_CATEGORIES = ['health','fitness','learning','finance','mindfulness','other'];

    // 7-day dot grid for a habit
    function HabitDotGrid({ log = [] }) {
      const today = DS.todayISO();
      const days = Array.from({ length: 7 }, (_, i) => addDays(today, -(6 - i)));
      return (
        <div className="flex gap-1 items-center">
          {days.map(d => {
            const entry = log.find(e => e.date === d);
            const isToday = d === today;
            const done   = entry?.done === true;
            const missed = entry?.done === false;
            return (
              <div key={d} title={d}
                className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] transition-transform ${isToday ? 'ring-2 ring-indigo-400 ring-offset-1' : ''} ${done ? 'bg-emerald-500 text-white' : missed ? 'bg-red-200 text-red-500' : 'bg-gray-100 text-gray-300'}`}>
                {done ? '✓' : missed ? '✗' : '·'}
              </div>
            );
          })}
        </div>
      );
    }

    // Weekly summary: days done this Mon–Sun week
    function habitWeekSummary(log = []) {
      const today = new Date(DS.todayISO() + 'T12:00:00');
      const dow = today.getDay(); // 0=Sun
      const weekStart = new Date(today);
      weekStart.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
      const days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(weekStart); d.setDate(weekStart.getDate() + i);
        return d.toISOString().split('T')[0];
      });
      const done = days.filter(d => log.some(e => e.date === d && e.done)).length;
      const past = days.filter(d => d <= DS.todayISO()).length;
      return { done, past, total: 7 };
    }

    // Add Habit Modal
    function AddHabitModal({ onSave, onClose }) {
      const [form, setForm] = useState({ name:'', frequency:'daily', category:'health', targetDays:66 });
      const f = v => setForm(p => ({ ...p, ...v }));
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4 relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-xl">×</button>
            <h2 className="text-lg font-bold text-gray-800">Add Habit</h2>

            <div>
              <label className="block text-xs font-medium text-gray-500 mb-1">Habit Name *</label>
              <input value={form.name} onChange={e => f({ name: e.target.value })} autoFocus
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                placeholder="e.g. Morning meditation" />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-medium text-gray-500 mb-1">Frequency</label>
                <select value={form.frequency} onChange={e => f({ frequency: e.target.value })}
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-medium text-gray-500 mb-1">Category</label>
                <select value={form.category} onChange={e => f({ category: e.target.value })}
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
                  {HABIT_CATEGORIES.map(c => <option key={c} value={c}>{c.charAt(0).toUpperCase()+c.slice(1)}</option>)}
                </select>
              </div>
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-500 mb-1">Target Days (habit formation goal)</label>
              <input type="number" min="7" max="365" value={form.targetDays} onChange={e => f({ targetDays: parseInt(e.target.value)||66 })}
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
            </div>

            <div className="flex gap-2 pt-1">
              <button onClick={() => form.name.trim() && onSave(form)} disabled={!form.name.trim()}
                className="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white text-sm font-medium py-2.5 rounded-xl transition-colors">
                Start Tracking
              </button>
              <button onClick={onClose} className="px-5 py-2.5 text-sm text-gray-500 hover:bg-gray-50 rounded-xl transition-colors">Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    function HabitsView({ tick, onRefresh }) {
      const [showAdd, setShowAdd] = useState(false);
      const today = DS.todayISO();
      const habits = DS.habits.list();

      const handleLog = h => {
        const alreadyDone = (h.log || []).some(e => e.date === today && e.done);
        DS.habits.logDay(h.id, today, !alreadyDone);
        onRefresh();
      };

      const handleAdd = form => {
        DS.habits.create({ name: form.name, frequency: form.frequency, category: form.category, targetDays: form.targetDays });
        setShowAdd(false); onRefresh();
      };

      const catColors = { health:'bg-rose-50 text-rose-600', fitness:'bg-orange-50 text-orange-600', learning:'bg-blue-50 text-blue-600', finance:'bg-emerald-50 text-emerald-600', mindfulness:'bg-violet-50 text-violet-600', other:'bg-gray-50 text-gray-500' };

      return (
        <div className="p-5 space-y-5">
          {showAdd && <AddHabitModal onSave={handleAdd} onClose={() => setShowAdd(false)} />}

          {/* Header */}
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-base font-bold text-gray-800">Habit Tracker</h2>
              <p className="text-xs text-gray-400 mt-0.5">
                {habits.filter(h => (h.log||[]).some(e => e.date === today && e.done)).length}/{habits.length} completed today
              </p>
            </div>
            <button onClick={() => setShowAdd(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition-colors">
              + Habit
            </button>
          </div>

          {habits.length === 0 && <EmptyState icon="🔄" text="No habits tracked yet. Add your first one!" />}

          {/* Habit grid */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
            {habits.map(h => {
              const doneToday = (h.log || []).some(e => e.date === today && e.done);
              const week      = habitWeekSummary(h.log || []);
              const rate30    = DS.habits.adherenceRate(h.id, 30);
              const streak    = h.currentStreak || 0;
              const longest   = h.longestStreak || 0;
              const pct       = h.targetDays ? Math.min(100, Math.round(streak / h.targetDays * 100)) : null;

              return (
                <div key={h.id} className={`rounded-2xl border p-4 space-y-3 transition-colors group ${doneToday ? 'border-emerald-200 bg-emerald-50/40' : 'border-gray-100 bg-white hover:border-gray-200'}`}>
                  {/* Top row */}
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="font-semibold text-gray-800 truncate">{h.name}</span>
                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium capitalize ${catColors[h.category] || catColors.other}`}>{h.category}</span>
                        <span className="text-[10px] text-gray-400 capitalize">{h.frequency}</span>
                      </div>
                      <div className="flex items-center gap-3 mt-1">
                        <span className="text-sm font-bold text-orange-500">🔥 {streak}</span>
                        {longest > streak && <span className="text-[11px] text-gray-400">best: {longest}</span>}
                        <span className="text-[11px] text-gray-400">{rate30}% / 30d</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-1.5 shrink-0">
                      <button onClick={() => handleLog(h)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-colors ${doneToday ? 'bg-emerald-500 text-white hover:bg-emerald-600' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                        {doneToday ? '✓ Done' : 'Log Today'}
                      </button>
                      <button onClick={() => { DS.habits.delete(h.id); onRefresh(); }}
                        className="opacity-0 group-hover:opacity-100 w-6 h-6 flex items-center justify-center text-gray-300 hover:text-red-400 transition-all text-sm rounded-full hover:bg-red-50">✕</button>
                    </div>
                  </div>

                  {/* 7-day dots */}
                  <HabitDotGrid log={h.log || []} />

                  {/* Weekly summary */}
                  <div className="flex items-center justify-between text-xs text-gray-500">
                    <span>This week: <span className={`font-semibold ${week.done >= week.past ? 'text-emerald-600' : 'text-amber-600'}`}>{week.done}/{week.past} days</span></span>
                    {pct !== null && (
                      <div className="flex items-center gap-1.5">
                        <div className="w-20 h-1.5 bg-gray-200 rounded-full overflow-hidden">
                          <div className="h-full bg-indigo-500 rounded-full transition-all" style={{ width: `${pct}%` }} />
                        </div>
                        <span className="text-gray-400">{pct}% to goal</span>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Weekly summary card */}
          {habits.length > 0 && (
            <div className="rounded-2xl border border-indigo-100 bg-indigo-50/50 p-4">
              <h3 className="text-xs font-bold text-indigo-700 uppercase tracking-wider mb-3">This Week's Summary</h3>
              <div className="space-y-2">
                {habits.map(h => {
                  const w = habitWeekSummary(h.log || []);
                  const pct = w.past > 0 ? Math.round(w.done / w.past * 100) : 0;
                  return (
                    <div key={h.id} className="flex items-center gap-3">
                      <span className="text-xs text-gray-600 w-32 truncate shrink-0">{h.name}</span>
                      <div className="flex-1 h-2 bg-white rounded-full overflow-hidden border border-indigo-100">
                        <div className={`h-full rounded-full transition-all ${pct >= 80 ? 'bg-emerald-500' : pct >= 50 ? 'bg-amber-400' : 'bg-red-400'}`} style={{ width: `${pct}%` }} />
                      </div>
                      <span className="text-xs font-semibold text-indigo-600 w-16 text-right shrink-0">{w.done}/{w.past} days</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── Medications ─────────────────────────────────────────────────────────────
    const TIME_ANCHORS = ['morning','noon','evening','bedtime','custom'];
    const TIME_ANCHOR_LABELS = { morning:'🌅 Morning', noon:'☀️ Noon', evening:'🌆 Evening', bedtime:'🌙 Bedtime', custom:'⏰ Custom' };

    // 30-day adherence heatmap
    function AdherenceHeatmap({ log = [] }) {
      const today = DS.todayISO();
      const days = Array.from({ length: 30 }, (_, i) => addDays(today, -(29 - i)));
      return (
        <div>
          <div className="flex flex-wrap gap-0.5">
            {days.map(d => {
              const entry  = log.find(e => e.date === d);
              const future = d > today;
              const taken  = entry?.taken === true;
              const missed = entry?.taken === false;
              return (
                <div key={d} title={`${d}: ${future ? 'future' : taken ? 'taken' : missed ? 'missed' : 'no log'}`}
                  className={`w-4 h-4 rounded-sm ${future ? 'bg-gray-100' : taken ? 'bg-emerald-400' : missed ? 'bg-red-300' : 'bg-gray-200'}`} />
              );
            })}
          </div>
          <div className="flex items-center gap-4 mt-2 text-[10px] text-gray-400">
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-emerald-400 inline-block"/> Taken</span>
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-red-300 inline-block"/> Missed</span>
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-gray-200 inline-block"/> No log</span>
          </div>
        </div>
      );
    }

    // Add Medication Modal
    function AddMedicationModal({ onSave, onClose }) {
      const [form, setForm] = useState({ name:'', dosage:'', timeAnchor:'morning', customTime:'', reminderTime:'', notes:'' });
      const f = v => setForm(p => ({ ...p, ...v }));
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4 relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-xl">×</button>
            <h2 className="text-lg font-bold text-gray-800">Add Medication</h2>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-medium text-gray-500 mb-1">Name *</label>
                <input value={form.name} onChange={e => f({ name: e.target.value })} autoFocus
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                  placeholder="e.g. Metformin" />
              </div>
              <div>
                <label className="block text-xs font-medium text-gray-500 mb-1">Dosage</label>
                <input value={form.dosage} onChange={e => f({ dosage: e.target.value })}
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                  placeholder="e.g. 500mg" />
              </div>
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-500 mb-2">Time</label>
              <div className="flex flex-wrap gap-2">
                {TIME_ANCHORS.map(a => (
                  <button key={a} onClick={() => f({ timeAnchor: a })}
                    className={`px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ${form.timeAnchor === a ? 'bg-indigo-600 text-white border-indigo-600' : 'border-gray-200 text-gray-600 hover:border-indigo-300'}`}>
                    {TIME_ANCHOR_LABELS[a]}
                  </button>
                ))}
              </div>
              {form.timeAnchor === 'custom' && (
                <input type="time" value={form.customTime} onChange={e => f({ customTime: e.target.value })}
                  className="mt-2 w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
              )}
            </div>

            <div>
              <label className="block text-xs font-medium text-gray-500 mb-1">Notes</label>
              <textarea value={form.notes} onChange={e => f({ notes: e.target.value })} rows={2}
                className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
                placeholder="Take with food, etc." />
            </div>

            <div className="flex gap-2 pt-1">
              <button onClick={() => form.name.trim() && onSave(form)} disabled={!form.name.trim()}
                className="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white text-sm font-medium py-2.5 rounded-xl transition-colors">
                Add Medication
              </button>
              <button onClick={onClose} className="px-5 py-2.5 text-sm text-gray-500 hover:bg-gray-50 rounded-xl transition-colors">Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    function MedicationsView({ tick, onRefresh }) {
      const [showAdd, setShowAdd]     = useState(false);
      const [expanded, setExpanded]   = useState(null); // med id with heatmap open
      const today = DS.todayISO();
      const meds  = DS.medications.list();

      const handleAdd = form => {
        DS.medications.create({ name: form.name, dosage: form.dosage, timeAnchor: form.timeAnchor, customTime: form.customTime || null, reminderTime: form.reminderTime || null, notes: form.notes });
        setShowAdd(false); onRefresh();
      };

      const handleToggle = m => {
        const takenToday = (m.log || []).some(e => e.date === today && e.taken);
        DS.medications.logDose(m.id, today, !takenToday, null);
        onRefresh();
      };

      // Consecutive miss banners
      const missAlerts = meds.filter(m => getMedConsecutiveMisses(m) >= 2);

      // Today's status for a med
      const todayStatus = m => {
        const entry = (m.log || []).find(e => e.date === today);
        if (!entry) return 'pending';
        return entry.taken ? 'taken' : 'missed';
      };

      const timeLabel = m => {
        if (m.timeAnchor === 'custom') return m.customTime || 'Custom';
        return TIME_ANCHOR_LABELS[m.timeAnchor] || m.timeAnchor;
      };

      // 7-day adherence
      const weekAdherence = m => {
        const days = Array.from({ length: 7 }, (_, i) => addDays(today, -(6 - i)));
        const taken = days.filter(d => (m.log || []).some(e => e.date === d && e.taken)).length;
        return { taken, total: 7, pct: Math.round(taken / 7 * 100) };
      };

      return (
        <div className="p-5 space-y-4">
          {showAdd && <AddMedicationModal onSave={handleAdd} onClose={() => setShowAdd(false)} />}

          {/* Miss banners */}
          {missAlerts.map(m => {
            const misses = getMedConsecutiveMisses(m);
            return (
              <div key={m.id} className="flex items-center gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
                <span className="text-xl shrink-0">⚠️</span>
                <div className="flex-1 text-sm">
                  <span className="font-semibold text-red-700">{m.name}</span>
                  <span className="text-red-600"> missed {misses} day{misses!==1?'s':''} in a row. Want to adjust the reminder time?</span>
                </div>
                <button onClick={() => { setExpanded(expanded === m.id ? null : m.id); }}
                  className="shrink-0 text-xs bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg transition-colors font-medium">
                  Review
                </button>
              </div>
            );
          })}

          {/* Header */}
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-base font-bold text-gray-800">Medications</h2>
              <p className="text-xs text-gray-400 mt-0.5">
                {meds.filter(m => todayStatus(m) === 'taken').length}/{meds.length} taken today
              </p>
            </div>
            <button onClick={() => setShowAdd(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition-colors">
              + Medication
            </button>
          </div>

          {meds.length === 0 && <EmptyState icon="💊" text="No medications tracked yet." />}

          {/* Med list */}
          <div className="space-y-3">
            {meds.map(m => {
              const status  = todayStatus(m);
              const week    = weekAdherence(m);
              const isOpen  = expanded === m.id;
              const streak  = m.currentStreak || 0;
              const adh     = m.adherencePercent || 0;

              const statusPill = status === 'taken'
                ? { label:'✅ Taken', cls:'bg-emerald-100 text-emerald-700' }
                : status === 'missed'
                  ? { label:'❌ Missed', cls:'bg-red-100 text-red-600' }
                  : { label:'⏰ Pending', cls:'bg-amber-100 text-amber-700' };

              return (
                <div key={m.id} className="rounded-2xl border border-gray-100 bg-white group">
                  {/* Main row */}
                  <div className="flex items-center gap-3 px-4 py-3.5">
                    <span className="text-2xl shrink-0">💊</span>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="font-semibold text-gray-800">{m.name}</span>
                        {m.dosage && <span className="text-xs text-gray-400">{m.dosage}</span>}
                        <span className={`text-[11px] px-2 py-0.5 rounded-full font-medium ${statusPill.cls}`}>{statusPill.label}</span>
                      </div>
                      <div className="flex items-center gap-3 mt-0.5 text-xs text-gray-400 flex-wrap">
                        <span>{timeLabel(m)}</span>
                        <span>🔥 {streak}d streak</span>
                        <span>{adh}% / 30d</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button onClick={() => handleToggle(m)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-colors ${status === 'taken' ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                        {status === 'taken' ? 'Undo' : 'Mark Taken'}
                      </button>
                      <button onClick={() => setExpanded(isOpen ? null : m.id)}
                        className="w-7 h-7 flex items-center justify-center text-gray-300 hover:text-indigo-500 transition-colors text-lg">
                        {isOpen ? '▲' : '▼'}
                      </button>
                      <button onClick={() => { DS.medications.delete(m.id); onRefresh(); }}
                        className="opacity-0 group-hover:opacity-100 w-6 h-6 flex items-center justify-center text-gray-300 hover:text-red-400 transition-all text-sm rounded-full hover:bg-red-50">✕</button>
                    </div>
                  </div>

                  {/* 7-day adherence bar */}
                  <div className="px-4 pb-3">
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] text-gray-400 shrink-0 w-16">7d: {week.pct}%</span>
                      <div className="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div className={`h-full rounded-full transition-all ${week.pct >= 80 ? 'bg-emerald-500' : week.pct >= 50 ? 'bg-amber-400' : 'bg-red-400'}`} style={{ width: `${week.pct}%` }} />
                      </div>
                      <span className="text-[10px] text-gray-400 shrink-0">30d: {adh}%</span>
                      <div className="w-16 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div className={`h-full rounded-full transition-all ${adh >= 80 ? 'bg-emerald-500' : adh >= 50 ? 'bg-amber-400' : 'bg-red-400'}`} style={{ width: `${adh}%` }} />
                      </div>
                    </div>
                  </div>

                  {/* Expanded: 30-day heatmap */}
                  {isOpen && (
                    <div className="border-t border-gray-100 px-4 py-3 bg-gray-50/50 rounded-b-2xl">
                      <div className="text-xs font-semibold text-gray-500 mb-2">30-Day Adherence</div>
                      <AdherenceHeatmap log={m.log || []} />
                      {m.notes && <p className="text-xs text-gray-400 mt-2 italic">{m.notes}</p>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── Checklists ───────────────────────────────────────────────────────────────
    const SEASON_COLOR = {
      spring: { bar:'bg-green-500',  ring:'ring-green-400', badge:'bg-green-100 text-green-700',  border:'border-green-200' },
      summer: { bar:'bg-amber-500',  ring:'ring-amber-400', badge:'bg-amber-100 text-amber-700',  border:'border-amber-200' },
      fall:   { bar:'bg-orange-500', ring:'ring-orange-400',badge:'bg-orange-100 text-orange-700',border:'border-orange-200' },
      winter: { bar:'bg-blue-500',   ring:'ring-blue-400',  badge:'bg-blue-100 text-blue-700',    border:'border-blue-200' },
    };

    function ChecklistsView({ tick, onRefresh }) {
      const year       = new Date().getFullYear();
      const curSeason  = getCurrentSeason();
      const [tab, setTab]           = useState(curSeason);
      const [cl, setCl]             = useState(() => initSeasonalCL(tab, year));
      const [editNote, setEditNote] = useState(null);
      const [noteText, setNoteText] = useState('');
      const [addText, setAddText]   = useState('');
      const [copied, setCopied]     = useState(false);

      useEffect(() => { setCl(initSeasonalCL(tab, year)); }, [tab, tick]);

      const save = updated => { saveSeasonalCL(tab, year, updated); setCl(updated); onRefresh(); };

      const toggle = id =>
        save({ ...cl, items: cl.items.map(i => i.id===id ? { ...i, done:!i.done, na: i.done ? i.na : false } : i) });

      const toggleNA = id =>
        save({ ...cl, items: cl.items.map(i => i.id===id ? { ...i, na:!i.na, done: !i.na ? false : i.done } : i) });

      const saveNote = id => {
        save({ ...cl, items: cl.items.map(i => i.id===id ? { ...i, notes:noteText } : i) });
        setEditNote(null);
      };

      const addCustom = () => {
        if (!addText.trim()) return;
        const item = { id:genId('si'), name:addText.trim(), done:false, na:false, notes:'', carriedOver:false, custom:true };
        save({ ...cl, items: [...cl.items, item] });
        setAddText('');
      };

      const delItem = id => save({ ...cl, items: cl.items.filter(i => i.id!==id) });

      const shareText = () => {
        const m = SEASON_META[tab];
        const lines = [
          `${m.emoji} ${m.label} Checklist ${year}  —  ${doneCount}/${active} complete`,
          '',
          ...cl.items.map(i => `[${i.done ? 'X' : i.na ? 'N/A' : ' '}] ${i.carriedOver ? '🔄 ' : ''}${i.name}${i.notes ? `  (${i.notes})` : ''}`),
        ];
        navigator.clipboard?.writeText(lines.join('\n')).then(() => {
          setCopied(true); setTimeout(() => setCopied(false), 2200);
        });
      };

      const items     = cl.items || [];
      const carried   = items.filter(i => i.carriedOver);
      const regular   = items.filter(i => !i.carriedOver);
      const doneCount = items.filter(i => i.done).length;
      const naCount   = items.filter(i => i.na).length;
      const total     = items.length;
      const active    = total - naCount;
      const pct       = active > 0 ? Math.round(doneCount / active * 100) : 0;
      const sc        = SEASON_COLOR[tab];

      const ItemRow = ({ item }) => {
        const isEditing = editNote === item.id;
        return (
          <div className={`group rounded-xl border px-4 py-3 transition-colors ${item.done || item.na ? 'bg-gray-50 border-gray-100' : 'bg-white border-gray-200 hover:border-gray-300'}`}>
            <div className="flex items-center gap-2.5">
              {item.carriedOver && <span className="text-sm shrink-0 text-amber-500" title="Carried over from last year">🔄</span>}
              {/* Checkbox */}
              <button onClick={() => toggle(item.id)} disabled={item.na}
                className={`w-5 h-5 rounded border-2 flex items-center justify-center shrink-0 text-xs transition-colors ${
                  item.done ? 'bg-emerald-500 border-emerald-500 text-white'
                  : item.na ? 'border-gray-200 bg-gray-100 cursor-not-allowed'
                  : 'border-gray-300 hover:border-emerald-400'
                }`}>
                {item.done && '✓'}
              </button>
              {/* Label */}
              <span className={`flex-1 text-sm leading-snug ${item.done || item.na ? 'line-through text-gray-400' : 'text-gray-800'}`}>
                {item.name}
                {item.custom && <span className="ml-1.5 text-[10px] text-indigo-400 font-medium">custom</span>}
              </span>
              {/* Note button */}
              <button onClick={() => { setEditNote(isEditing ? null : item.id); setNoteText(item.notes || ''); }}
                className={`text-xs px-2 py-1 rounded-lg transition-colors shrink-0 ${
                  item.notes ? 'text-indigo-500 bg-indigo-50 hover:bg-indigo-100'
                  : 'text-gray-400 hover:text-gray-600 hover:bg-gray-100 opacity-0 group-hover:opacity-100'
                }`}>
                {item.notes ? '📝' : '+ note'}
              </button>
              {/* N/A */}
              <button onClick={() => toggleNA(item.id)}
                className={`text-xs px-2 py-1 rounded-lg transition-colors shrink-0 ${
                  item.na ? 'bg-gray-200 text-gray-600 font-semibold'
                  : 'text-gray-300 hover:text-gray-600 hover:bg-gray-100 opacity-0 group-hover:opacity-100'
                }`}>
                N/A
              </button>
              {/* Delete custom */}
              {item.custom && (
                <button onClick={() => delItem(item.id)}
                  className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-400 text-xs transition-all shrink-0">✕</button>
              )}
            </div>
            {/* Inline note editor */}
            {isEditing && (
              <div className="mt-2 flex gap-2 pl-7">
                <input className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-300"
                  placeholder="Add a note…" value={noteText}
                  onChange={e => setNoteText(e.target.value)}
                  onKeyDown={e => { if (e.key==='Enter') saveNote(item.id); if (e.key==='Escape') setEditNote(null); }}
                  autoFocus />
                <button onClick={() => saveNote(item.id)} className="text-xs text-indigo-600 hover:text-indigo-800 font-semibold px-2">Save</button>
                <button onClick={() => setEditNote(null)} className="text-xs text-gray-400 hover:text-gray-600 px-1">✕</button>
              </div>
            )}
            {!isEditing && item.notes && (
              <p className="mt-1 text-xs text-gray-400 italic pl-7">{item.notes}</p>
            )}
          </div>
        );
      };

      return (
        <div className="p-5 space-y-4 max-w-2xl">
          {/* Season tabs */}
          <div className="flex gap-1 bg-gray-100 p-1 rounded-xl">
            {SEASONS.map(s => {
              const m = SEASON_META[s];
              return (
                <button key={s} onClick={() => setTab(s)}
                  className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-sm font-medium transition-colors ${tab===s ? 'bg-white shadow text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>
                  <span>{m.emoji}</span>
                  <span className="hidden sm:inline">{m.label}</span>
                  {s === curSeason && <span className="w-1.5 h-1.5 rounded-full bg-indigo-500 shrink-0" />}
                </button>
              );
            })}
          </div>

          {/* Progress header */}
          <div className="bg-white border border-gray-200 rounded-xl px-5 py-4 space-y-3">
            <div className="flex items-start justify-between gap-3">
              <div>
                <h2 className="font-bold text-gray-800 text-base">{SEASON_META[tab].emoji} {SEASON_META[tab].label} Checklist {year}</h2>
                <p className="text-xs text-gray-400 mt-0.5">
                  {doneCount} of {active} complete
                  {naCount > 0 ? ` · ${naCount} N/A` : ''}
                  {carried.length > 0 ? ` · ${carried.length} carried over` : ''}
                </p>
              </div>
              <button onClick={shareText}
                className="text-xs px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium transition-colors shrink-0">
                {copied ? '✓ Copied!' : '📋 Share'}
              </button>
            </div>
            {total > 0 && (
              <div className="space-y-1">
                <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                  <div className={`h-full rounded-full transition-all duration-300 ${sc.bar}`} style={{ width: `${pct}%` }} />
                </div>
                <div className="flex items-center justify-between text-[11px] text-gray-400">
                  <span>{pct}% complete</span>
                  {pct === 100 && <span className="text-emerald-600 font-semibold">All done! 🎉</span>}
                </div>
              </div>
            )}
          </div>

          {/* Carried-over section */}
          {carried.length > 0 && (
            <div className="space-y-2">
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold text-amber-600 uppercase tracking-wider">🔄 Carried Over from {year - 1}</span>
                <span className={`text-xs px-2 py-0.5 rounded-full font-semibold bg-amber-100 text-amber-700`}>{carried.length}</span>
              </div>
              {carried.map(item => <ItemRow key={item.id} item={item} />)}
              <div className="border-t border-gray-100 pt-2">
                <span className="text-xs font-semibold text-gray-500 uppercase tracking-wider">This Season</span>
              </div>
            </div>
          )}

          {/* Regular items */}
          <div className="space-y-2">
            {regular.map(item => <ItemRow key={item.id} item={item} />)}
          </div>

          {/* Add custom item */}
          <div className={`border-2 border-dashed rounded-xl px-4 py-3 transition-colors ${addText ? 'border-indigo-300 bg-indigo-50' : 'border-gray-200 hover:border-gray-300'}`}>
            <div className="flex gap-2 items-center">
              <span className="text-gray-300 text-sm">+</span>
              <input className="flex-1 bg-transparent text-sm focus:outline-none placeholder-gray-400 text-gray-700"
                placeholder="Add custom item…"
                value={addText}
                onChange={e => setAddText(e.target.value)}
                onKeyDown={e => e.key==='Enter' && addCustom()} />
              {addText.trim() && (
                <>
                  <button onClick={addCustom} className="text-xs text-indigo-600 hover:text-indigo-800 font-semibold shrink-0">Add</button>
                  <button onClick={() => setAddText('')} className="text-xs text-gray-400 hover:text-gray-600 shrink-0">✕</button>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Journal ──────────────────────────────────────────────────────────────────
    function JournalView({ tick }) {
      const todayStr = DS.todayISO();
      const yesterday = addDays(todayStr, -1);

      const [entries,   setEntries]   = useState(() => DS.journal.list());
      const [selDate,   setSelDate]   = useState(todayStr);
      const [content,   setContent]   = useState('');
      const [mood,      setMood]      = useState(null);
      const [saveState, setSaveState] = useState('saved');
      const [search,    setSearch]    = useState('');
      const currentIdRef = useRef(null);
      const saveTimerRef = useRef(null);

      // Load entry for the selected date
      useEffect(() => {
        const entry = DS.journal.getByDate(selDate)[0] || null;
        currentIdRef.current = entry ? entry.id : null;
        setContent(entry ? entry.content : '');
        setMood(entry ? entry.mood : null);
        setSaveState('saved');
      }, [selDate]);

      const doSave = useCallback((text, m) => {
        if (!text.trim() && !m) return;
        if (currentIdRef.current) {
          DS.journal.update(currentIdRef.current, { content: text, mood: m });
        } else {
          const e = DS.journal.create({ date: selDate, content: text, mood: m });
          currentIdRef.current = e.id;
        }
        setEntries(DS.journal.list());
        setSaveState('saved');
      }, [selDate]);

      const handleContentChange = val => {
        setContent(val);
        setSaveState('unsaved');
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(() => doSave(val, mood), 1000);
      };

      const handleMoodChange = m => {
        const next = mood === m ? null : m;
        setMood(next);
        clearTimeout(saveTimerRef.current);
        doSave(content, next);
      };

      const selectDate = date => {
        clearTimeout(saveTimerRef.current);
        if (saveState === 'unsaved') doSave(content, mood);
        setSelDate(date);
      };

      const deleteEntry = (id, e) => {
        e.stopPropagation();
        if (!confirm('Delete this journal entry?')) return;
        DS.journal.delete(id);
        if (currentIdRef.current === id) { currentIdRef.current = null; setContent(''); setMood(null); }
        setEntries(DS.journal.list());
      };

      const MOODS = [
        { v:'great', e:'😊', label:'Great' },
        { v:'good',  e:'🙂', label:'Good'  },
        { v:'okay',  e:'😐', label:'Okay'  },
        { v:'rough', e:'😔', label:'Rough' },
        { v:'bad',   e:'😞', label:'Bad'   },
      ];
      const moodOf  = m => MOODS.find(x => x.v === m);
      const labelDate = d => d === todayStr ? 'Today' : d === yesterday ? 'Yesterday' : fmtDate(d);
      const wordCount = content.trim() ? content.trim().split(/\s+/).length : 0;

      const filtered = search.trim()
        ? entries.filter(e => e.content.toLowerCase().includes(search.toLowerCase()) || e.date.includes(search))
        : entries;

      return (
        <div className="flex h-full">

          {/* ── Left sidebar ── */}
          <div className="w-56 shrink-0 border-r border-gray-100 flex flex-col bg-white">
            <button onClick={() => selectDate(todayStr)}
              className={`flex items-center gap-2 px-4 py-3 border-b border-gray-100 text-sm font-semibold transition-colors ${selDate === todayStr ? 'bg-indigo-50 text-indigo-700' : 'text-gray-700 hover:bg-gray-50'}`}>
              <span>✏️</span> Today's Entry
            </button>

            <div className="px-3 py-2 border-b border-gray-100">
              <input className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-300"
                placeholder="Search entries…" value={search} onChange={e => setSearch(e.target.value)} />
            </div>

            <div className="flex-1 overflow-y-auto">
              {filtered.length === 0 && (
                <p className="text-xs text-gray-400 p-4 text-center">{search ? 'No matches' : 'No past entries yet'}</p>
              )}
              {filtered.map(entry => (
                <button key={entry.id} onClick={() => selectDate(entry.date)}
                  className={`w-full text-left px-4 py-3 border-b border-gray-50 transition-colors group relative ${selDate === entry.date ? 'bg-indigo-50' : 'hover:bg-gray-50'}`}>
                  <div className="flex items-center justify-between">
                    <span className={`text-xs font-medium ${selDate === entry.date ? 'text-indigo-700' : 'text-gray-700'}`}>{labelDate(entry.date)}</span>
                    <span className="text-sm">{moodOf(entry.mood) ? moodOf(entry.mood).e : ''}</span>
                  </div>
                  <p className="text-xs text-gray-400 mt-0.5 truncate pr-5">
                    {entry.content ? entry.content.slice(0, 45) + (entry.content.length > 45 ? '…' : '') : '—'}

                <div className="flex items-center gap-0.5 pt-0.5">

                      {m.e}
                    </button>
                  ))}

              </div>
              {mood && (
                <p className="mt-1.5 text-xs text-gray-500">
                  Feeling <span className="font-medium text-gray-700">{moodOf(mood).label}</span>
                  <button onClick={() => handleMoodChange(mood)} className="ml-1.5 text-gray-300 hover:text-gray-500 leading-none">✕</button>
                </p>

            <textarea
              className="flex-1 resize-none px-6 py-5 text-gray-800 text-sm leading-7 focus:outline-none bg-white placeholder-gray-300"

              value={content}
              onChange={e => handleContentChange(e.target.value)}

            <div className="px-6 py-2.5 border-t border-gray-100 flex items-center justify-between">

                {saveState === 'saving' ? 'Saving…' : saveState === 'unsaved' ? '● Unsaved' : '✓ Saved'}
              </span>
            </div>
          </div>

        </div>
      );
    }

    // ─── Settings ─────────────────────────────────────────────────────────────────
    function SettingsView({ onRunAnalysis, insightsLoading, onOpenDigest }) {
      const [tab, setTab]   = useState('profile');
      const [saved, setSaved] = useState(false);

      // Profile
      const [apiKey, setApiKey]           = useState(window.storage.get('settings:api_key') || '');
      const [endpointUrl, setEndpointUrl] = useState(window.storage.get('settings:endpoint_url') || '');

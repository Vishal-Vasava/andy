    // ─── Onboarding ───────────────────────────────────────────────────────────────
    function Onboarding({ onDone }) {
      const TOTAL = 5;
      const [step, setStep]           = useState(1);
      const [name, setName]                   = useState('');
      const [endpointUrl, setEndpointUrl]     = useState('');
      const [wakeTime, setWakeTime]           = useState('07:00');
      const [briefTime, setBriefTime] = useState('08:00');
      const [digestTime, setDigestTime] = useState('21:00');
      const [family, setFamily]       = useState([]);
      const [famForm, setFamForm]     = useState({ name: '', relationship: 'partner' });
      const [quickWin, setQuickWin]   = useState('');
      const [parsing, setParsing]     = useState(false);
      const [parsedItem, setParsedItem] = useState(null);

      const RELS = ['partner','spouse','child','parent','sibling','other'];

      const addMember = () => {
        if (!famForm.name.trim()) return;
        setFamily(p => [...p, { id: genId('fm'), name: famForm.name.trim(), relationship: famForm.relationship }]);
        setFamForm({ name: '', relationship: 'partner' });
      };

      const parseQuickWin = async () => {
        if (!quickWin.trim()) return;
        setParsing(true);
        try {
          const raw = await CS.callLLM(
            `Parse the user's statement into a task or deadline. Today is ${DS.todayISO()}. Return ONLY valid JSON with no markdown: { "type": "task"|"deadline", "title": string, "dueDate": "YYYY-MM-DD"|null, "priority": "P0"|"P1"|"P2"|"P3", "category": string }`,
            quickWin,
            256
          );
          const cleaned = raw.replace(/^```json\s*/im,'').replace(/^```\s*/im,'').replace(/\s*```$/im,'').trim();
          setParsedItem(JSON.parse(cleaned));
        } catch (_) {
          setParsedItem({ type: 'task', title: quickWin.trim(), dueDate: null, priority: 'P1', category: '' });
        } finally { setParsing(false); }
      };

      const next = async () => {
        if (step === 4 && quickWin.trim() && !parsedItem) {
          await parseQuickWin();
        }
        setStep(s => Math.min(s + 1, TOTAL));
      };

      const finish = () => {
        window.storage.set('settings:user_name',     name.trim() || 'there');
        window.storage.set('settings:endpoint_url',  endpointUrl.trim());
        window.storage.set('settings:wake_time',     wakeTime);
        window.storage.set('settings:briefing_time', briefTime);
        window.storage.set('settings:digest_time',   digestTime);
        window.storage.set('settings:onboarded',     true);
        family.forEach(m => DS.family.create({ name: m.name, relationship: m.relationship, role: 'dependent' }));
        if (parsedItem) {
          if (parsedItem.type === 'deadline') {
            DS.deadlines.create({ title: parsedItem.title, dueDate: parsedItem.dueDate || DS.todayISO(), category: parsedItem.category || 'other', alertDays: [30,14,7,3,1] });
          } else {
            DS.tasks.create({ title: parsedItem.title, dueDate: parsedItem.dueDate || null, priority: parsedItem.priority || 'P1', category: parsedItem.category || '' });
          }
        } else if (quickWin.trim()) {
          DS.tasks.create({ title: quickWin.trim(), priority: 'P1' });
        }
        onDone();
      };

      const canNext = step === 1 ? name.trim().length > 0 : true;
      const pct = ((step - 1) / (TOTAL - 1)) * 100;

      return (
        <div className="fixed inset-0 z-50 bg-gradient-to-br from-indigo-950 to-indigo-700 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div className="h-1 bg-gray-100">
              <div className="h-full bg-indigo-500 transition-all duration-500" style={{ width: `${pct}%` }} />
            </div>
            <div className="p-8">
              {/* Step dots */}
              <div className="flex items-center justify-center gap-2 mb-7">
                {Array.from({ length: TOTAL }, (_, i) => (
                  <div key={i} className={`h-2 rounded-full transition-all duration-300 ${i + 1 === step ? 'w-5 bg-indigo-600' : i + 1 < step ? 'w-2 bg-indigo-400' : 'w-2 bg-gray-200'}`} />
                ))}
              </div>

              {step === 1 && (
                <div className="space-y-4">
                  <div className="text-center mb-5">
                    <img src="andy2.png" alt="Andy" className="w-24 h-24 rounded-full object-cover mx-auto mb-3 ring-4 ring-indigo-100 shadow-md" />
                    <h1 className="text-2xl font-bold text-gray-900">Meet Andy</h1>
                    <p className="text-gray-500 mt-2 text-sm leading-relaxed">Your personal AI life assistant — tasks, habits, deadlines, family, medications and more.</p>
                  </div>
                  <Input label="What's your name?" placeholder="e.g. Alex" value={name} onChange={e => setName(e.target.value)} />
                  <div>
                    <label className="text-xs text-gray-500 block mb-1">SenseiAI Endpoint URL <span className="text-gray-400">(add later in Settings)</span></label>
                    <input type="text" className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="http://localhost:11434/v1" value={endpointUrl} onChange={e => setEndpointUrl(e.target.value)} />
                    <p className="text-xs text-gray-400 mt-1">Stored locally only. Required for AI features.</p>
                  </div>
                </div>
              )}

              {step === 2 && (
                <div className="space-y-4">
                  <div className="text-center mb-5">
                    <div className="text-4xl mb-2">⏰</div>
                    <h2 className="text-xl font-bold text-gray-900">Your daily rhythm</h2>
                    <p className="text-gray-500 text-sm mt-1">Andy will work around your schedule.</p>
                  </div>
                  <div>
                    <label className="text-xs text-gray-500 block mb-1">Wake time</label>
                    <input type="time" className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" value={wakeTime} onChange={e => setWakeTime(e.target.value)} />
                  </div>
                  <div>
                    <label className="text-xs text-gray-500 block mb-1">Morning briefing time</label>
                    <input type="time" className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" value={briefTime} onChange={e => setBriefTime(e.target.value)} />
                    <p className="text-xs text-gray-400 mt-1">Andy shows your daily brief when you open the app around this time.</p>
                  </div>
                  <div>
                    <label className="text-xs text-gray-500 block mb-1">Evening digest time</label>
                    <input type="time" className="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" value={digestTime} onChange={e => setDigestTime(e.target.value)} />
                    <p className="text-xs text-gray-400 mt-1">Day summary banner appears after this time.</p>
                  </div>
                </div>
              )}

              {step === 3 && (
                <div className="space-y-4">
                  <div className="text-center mb-5">
                    <div className="text-4xl mb-2">👨‍👩‍👧</div>
                    <h2 className="text-xl font-bold text-gray-900">Who do you care for?</h2>
                    <p className="text-gray-500 text-sm mt-1">Add family members Andy should keep in mind. You can skip and add later.</p>
                  </div>
                  {family.length > 0 && (
                    <div className="space-y-1.5">
                      {family.map((m, i) => (
                        <div key={i} className="flex items-center justify-between bg-indigo-50 rounded-xl px-4 py-2.5 text-sm">
                          <span className="font-medium text-gray-800">{m.name}</span>
                          <span className="text-gray-400 capitalize text-xs">{m.relationship}</span>
                          <button onClick={() => setFamily(p => p.filter((_, j) => j !== i))} className="text-gray-300 hover:text-red-500 ml-3 text-xs transition-colors">✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="flex gap-2">
                    <input className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="Name" value={famForm.name} onChange={e => setFamForm(p => ({ ...p, name: e.target.value }))} onKeyDown={e => e.key === 'Enter' && addMember()} />
                    <select className="border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" value={famForm.relationship} onChange={e => setFamForm(p => ({ ...p, relationship: e.target.value }))}>
                      {RELS.map(r => <option key={r} value={r}>{r.charAt(0).toUpperCase()+r.slice(1)}</option>)}
                    </select>
                    <button onClick={addMember} className="bg-indigo-600 text-white rounded-xl px-4 py-2 text-sm font-semibold hover:bg-indigo-700 transition-colors">Add</button>
                  </div>
                </div>
              )}

              {step === 4 && (
                <div className="space-y-4">
                  <div className="text-center mb-5">
                    <div className="text-4xl mb-2">💡</div>
                    <h2 className="text-xl font-bold text-gray-900">One thing you keep forgetting?</h2>
                    <p className="text-gray-500 text-sm mt-1">A task, deadline, or appointment you've been meaning to add. Andy will parse it automatically.</p>
                  </div>
                  <textarea className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none" rows={3} placeholder={"e.g. Renew car insurance before July 1st\nGet blood work done this month\nCall dad every Sunday"} value={quickWin} onChange={e => { setQuickWin(e.target.value); setParsedItem(null); }} />
                  {parsing && <p className="text-center text-sm text-gray-400 animate-pulse">Andy is parsing your item…</p>}
                  {parsedItem && (
                    <div className="bg-indigo-50 border border-indigo-200 rounded-xl px-4 py-3 text-sm">
                      <div className="flex items-start gap-2">
                        <span className="text-indigo-500 shrink-0 mt-0.5">✓</span>
                        <div>
                          <div className="font-medium text-indigo-900">{parsedItem.title}</div>
                          <div className="text-indigo-500 text-xs mt-0.5">
                            {parsedItem.type === 'deadline' ? '📅 Deadline' : '✅ Task'}
                            {parsedItem.dueDate && ` · Due ${fmtDate(parsedItem.dueDate)}`}
                            {parsedItem.priority && ` · ${parsedItem.priority}`}
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {step === 5 && (
                <div className="text-center py-2 space-y-3">
                  <div className="text-5xl mb-2">🎉</div>
                  <h2 className="text-2xl font-bold text-gray-900">You're all set{name ? `, ${name}` : ''}!</h2>
                  <p className="text-gray-500 text-sm leading-relaxed">Andy is ready to help. Start by chatting below, or explore any section in the sidebar.</p>
                  {family.length > 0 && <p className="text-sm text-gray-500">Added {family.length} family member{family.length !== 1 ? 's' : ''}.</p>}
                  {parsedItem && <p className="text-sm text-gray-500">Created your first {parsedItem.type}: <span className="font-medium text-gray-700">"{parsedItem.title}"</span></p>}
                </div>
              )}

              <div className={`flex gap-3 mt-8 ${step > 1 && step < 5 ? 'justify-between' : 'justify-end'}`}>
                {step > 1 && step < 5 && (
                  <button onClick={() => setStep(s => s - 1)} className="text-gray-400 hover:text-gray-600 text-sm py-2 px-3 transition-colors">← Back</button>
                )}
                {step < 5 && (
                  <button onClick={next} disabled={!canNext || parsing}
                    className={`py-3 px-6 rounded-xl font-semibold transition-colors text-sm ${canNext && !parsing ? 'bg-indigo-600 hover:bg-indigo-700 text-white' : 'bg-gray-100 text-gray-400 cursor-not-allowed'} ${step === 1 ? 'w-full' : ''}`}>
                    {parsing ? 'Parsing…' : step === 3 && family.length === 0 ? 'Skip →' : step === 4 && !quickWin.trim() ? 'Skip →' : 'Continue →'}
                  </button>
                )}
                {step === 5 && (
                  <button onClick={finish} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold transition-colors">
                    Open Andy →
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── Notifications ────────────────────────────────────────────────────────────
    function fireNotification(title, body, tag) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      // Prefer SW relay (shows even when tab not focused on Android)
      if (navigator.serviceWorker?.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'SHOW_NOTIFICATION', title, body, tag });
      } else {
        new Notification(title, { body, tag, icon: 'andy1.png', badge: 'andy1.png', renotify: false });
      }
    }

    function checkAndNotify() {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const today = DS.todayISO();
      const h = new Date().getHours();

      // Medication reminders — fire within 2h window after anchor time
      DS.medications.list().forEach(med => {
        const taken = (med.log || []).some(e => e.date === today && e.taken);
        if (taken) return;
        const ANCHOR = { morning: 8, noon: 12, evening: 18, bedtime: 21 };
        const ah = ANCHOR[med.timeAnchor] !== undefined ? ANCHOR[med.timeAnchor] : 8;
        if (h >= ah && h < ah + 2) {
          fireNotification('💊 Medication reminder',
            `Time to take ${med.name}${med.dosage ? ' ' + med.dosage : ''}.`,
            `med-${med.id}-${today}`);
        }
      });

      // Evening habit nudge (8pm–11pm)
      if (h >= 20 && h < 23) {
        const missed = DS.habits.list().filter(hb => !(hb.log || []).some(e => e.date === today && e.done));
        if (missed.length) {
          fireNotification(
            `🔄 ${missed.length} habit${missed.length > 1 ? 's' : ''} remaining`,
            missed.slice(0, 3).map(hb => hb.name).join(', ') + (missed.length > 3 ? '…' : ''),
            `habits-${today}`);
        }
      }

      // Items due today — remind at 8am
      if (h >= 8 && h < 10) {
        const dueToday = [
          ...DS.deadlines.list().filter(d => d.status !== 'done' && d.dueDate === today),
          ...DS.tasks.listOpen().filter(t => t.dueDate === today),
        ];
        if (dueToday.length) {
          fireNotification(
            `📋 ${dueToday.length} item${dueToday.length > 1 ? 's' : ''} due today`,
            dueToday.slice(0, 2).map(x => x.title).join(', ') + (dueToday.length > 2 ? '…' : ''),
            `duetoday-${today}`);
        }
      }

      // Overdue deadlines — remind once per day after 9am
      if (h >= 9 && h < 11) {
        const overdue = DS.deadlines.list().filter(d => d.status !== 'done' && d.dueDate < today);
        if (overdue.length) {
          fireNotification(
            `📅 ${overdue.length} overdue deadline${overdue.length > 1 ? 's' : ''}`,
            overdue.slice(0, 2).map(d => d.title).join(', ') + (overdue.length > 2 ? '…' : ''),
            `overdue-${today}`);
        }
      }
    }

    // ─── App root ─────────────────────────────────────────────────────────────────
    const VALID_SECTIONS = ['dashboard','tasks','deadlines','family','habits','medications','checklists','goals','triggers','journal','mind','sensei','vision','settings'];

    const initState = {
      section: (() => { const s = window.storage.get('app:section'); return VALID_SECTIONS.includes(s) ? s : 'dashboard'; })(),
      messages:       [],
      chatInput:      '',
      thinking:       false,
      sidebarOpen:    true,
      tick:           0,
      toast:          null,
      briefingOpen:   false,
      briefingLoading:false,
      briefing:       null,
      escalations:    [],
      insights:       null,
      insightsLoading:false,
      triggerBanners:  [],
      seasonalBanner:  null,
      digestBanner:   false,
      digestOpen:     false,
      digestLoading:  false,
      digest:         null,
      digestData:     null,
      installBanner:  false,
    };

    function App() {
      const [state, dispatch] = useReducer(reducer, initState);
      const [onboarding, setOnboarding] = useState(false);
      const thinkingRef = useRef(false);

      useEffect(() => {
        seedInitialData();
        if (!window.storage.get('settings:onboarded')) setOnboarding(true);

        // Expire overdue triggered alerts
        const todayForExpiry = DS.todayISO();
        DS.triggers.list()
          .filter(t => t.status === 'triggered' && t.actionDeadline && t.actionDeadline < todayForExpiry)
          .forEach(t => {
            DS.triggers.expire(t.id);
            DS.activity.log('trigger_expired', `Trigger expired without action: "${t.title}"`, { id: t.id });
          });

        // Run deadline alerts on boot
        const { fired, escalations } = runDeadlineAlerts();
        if (escalations.length) dispatch({ type: 'SET_ESCALATIONS', payload: escalations });
        fired.forEach(a =>
          dispatch({ type: 'TOAST', payload: { text: `📅 "${a.title}" due in ${a.daysLeft}d`, variant: 'warning' } })
        );

        // Hourly re-check
        const alertTimer = setInterval(() => {
          const { fired: f2, escalations: esc2 } = runDeadlineAlerts();
          dispatch({ type: 'SET_ESCALATIONS', payload: esc2 });
          f2.forEach(a =>
            dispatch({ type: 'TOAST', payload: { text: `📅 "${a.title}" due in ${a.daysLeft}d`, variant: 'warning' } })
          );
        }, 3_600_000);

        // Auto-show morning brief around the user's preferred briefing time (within 2h window)
        const briefingTime  = window.storage.get('settings:briefing_time') || '08:00';
        const [bh, bm]      = briefingTime.split(':').map(Number);
        const curH          = new Date().getHours();
        const curM          = new Date().getMinutes();
        const pastBriefTime = curH > bh || (curH === bh && curM >= bm);
        const inBriefWindow = curH < bh + 2;
        const lastBrief     = window.storage.get('settings:last_brief_date');
        if (pastBriefTime && inBriefWindow && lastBrief !== DS.todayISO()) {
          setTimeout(() => generateBriefing(), 1200);
        }

        // 9pm habit nudges (on mount + in hourly loop)
        const nudges = runHabitNudges();
        if (nudges.length) {
          const names = nudges.map(h => `"${h.name}"`).join(', ');
          dispatch({ type: 'ADD_MSG', payload: { role: 'assistant', type: 'text', content: `Hey! You haven't logged ${names} yet today — still time to get it done before bed. 💪` } });
        }

        // Load stored insights from previous analysis
        const storedInsights = window.storage.get('settings:insights');
        if (storedInsights && Array.isArray(storedInsights) && storedInsights.length > 0) {
          dispatch({ type: 'SET_INSIGHTS', payload: storedInsights });
        }

        // Auto-run analysis every Sunday (if not already run today)
        const todayDay = new Date().getDay(); // 0 = Sunday
        const lastAnalysis = window.storage.get('settings:insights_date');
        if (todayDay === 0 && lastAnalysis !== DS.todayISO() && (window.storage.get('settings:endpoint_url') || window.storage.get('settings:api_key'))) {
          setTimeout(() => runAnalysisCallback(), 5000);
        }

        // Evening digest banner — show if past digest time and not dismissed today
        const digestTime = window.storage.get('settings:digest_time') || '21:00';
        const [dh, dm] = digestTime.split(':').map(Number);
        const nowH = new Date().getHours();
        const nowM = new Date().getMinutes();
        const pastDigestTime = nowH > dh || (nowH === dh && nowM >= dm);
        const digestDismissed = window.storage.get('settings:digest_dismissed');
        if (pastDigestTime && digestDismissed !== DS.todayISO()) {
          dispatch({ type: 'DIGEST_BANNER', payload: true });
        }

        // Seasonal checklist banner — surface once per season per year
        const season = getCurrentSeason();
        const yr     = new Date().getFullYear();
        const surfacedKey = `settings:seasonal_surfaced:${season}:${yr}`;
        if (!window.storage.get(surfacedKey)) {
          const cl = initSeasonalCL(season, yr);
          const undone = (cl.items || []).filter(i => !i.done && !i.na).length;
          dispatch({ type: 'SEASONAL_BANNER', payload: { season, year: yr, count: undone } });
        }

        // Request notification permission (after 4s so it doesn't feel intrusive)
        if ('Notification' in window && Notification.permission === 'default') {
          setTimeout(() => Notification.requestPermission(), 4000);
        }

        // Periodic notification checks every 30 minutes
        checkAndNotify();
        const notifTimer = setInterval(checkAndNotify, 30 * 60 * 1000);

        // Show install banner if not already running as a standalone PWA
        if (!window.matchMedia('(display-mode: standalone)').matches) {
          dispatch({ type: 'SET_INSTALL_BANNER', payload: true });
        }
        // Capture deferred prompt if it arrives (enables one-click install)
        const onInstallPrompt = e => { window._andyInstallPrompt = e; };
        window.addEventListener('beforeinstallprompt', onInstallPrompt);

        return () => {
          clearInterval(alertTimer);
          clearInterval(notifTimer);
          window.removeEventListener('beforeinstallprompt', onInstallPrompt);
        };
      }, []);

      const onRefresh = () => dispatch({ type: 'REFRESH' });

      // Build clean history for API (only user/assistant text turns)
      const apiHistory = useCallback(() => {
        return state.messages
          .filter(m => (m.role === 'user' || m.role === 'assistant') && m.type !== 'action' && m.type !== 'result')
          .map(m => ({ role: m.role, content: m.content }));
      }, [state.messages]);

      const showToast = useCallback((text, variant = 'success') => {
        dispatch({ type: 'TOAST', payload: { text, variant } });
      }, []);

      // Core send function — accepts text directly
      const sendMessage = useCallback(async (text) => {
        if (!text || thinkingRef.current) return;
        if (!window.storage.get('settings:endpoint_url') && !window.storage.get('settings:api_key')) {
          dispatch({ type: 'ADD_MSG', payload: { role: 'assistant', type: 'text', content: 'Please add a Claude API key or SenseiAI endpoint URL in ⚙️ Settings first.' } });
          return;
        }

        thinkingRef.current = true;
        dispatch({ type: 'ADD_MSG', payload: { role: 'user', type: 'text', content: text } });
        dispatch({ type: 'THINKING', payload: true });

        try {
          const history = apiHistory();
          const response = await CS.send(text, history);

          if (response.type === 'text') {
            // Plain text fallback
            dispatch({ type: 'ADD_MSG', payload: { role: 'assistant', type: 'text', content: response.raw } });

          } else {
            const { parsed } = response;
            const isConversational = ['query', 'reflect', 'converse'].includes(parsed.intent);

            if (isConversational) {
              // Just show the answer — no confirmation needed
              dispatch({ type: 'ADD_MSG', payload: {
                role: 'assistant', type: 'text',
                content: parsed.confirmation || parsed.raw,
              }});
            } else {
              // Show action card — wait for user to confirm
              dispatch({ type: 'ADD_MSG', payload: {
                role: 'assistant', type: 'action',
                parsed,
                status: 'pending',
              }});
            }
          }
        } catch (err) {
          dispatch({ type: 'ADD_MSG', payload: { role: 'assistant', type: 'text', content: `Error: ${err.message}` } });
          showToast(err.message, 'error');
        } finally {
          thinkingRef.current = false;
          dispatch({ type: 'THINKING', payload: false });
        }
      }, [apiHistory, showToast]);

      // User clicked "Yes, do it" on an action card
      const handleConfirm = useCallback((msgIndex, parsed) => {
        const result = CS.execute(parsed.intent, parsed.data || {});

        // Update the action card status
        dispatch({ type: 'PATCH_MSG', index: msgIndex, patch: { status: 'confirmed' } });

        if (result.success) {
          const entityLabels = { task:'Task', deadline:'Deadline', habit:'Habit', medication:'Medication', checklist:'Checklist', trigger:'Trigger', none:'' };
          const label = entityLabels[result.entity] || 'Item';
          if (result.entity !== 'none') {
            dispatch({ type: 'ADD_MSG', payload: { type: 'result', variant: 'success', content: `✓ ${label} saved.` } });
            showToast(`${label} saved successfully`, 'success');
          }
          onRefresh();
        } else {
          dispatch({ type: 'ADD_MSG', payload: { type: 'result', variant: 'error', content: `✗ ${result.message}` } });
          showToast(result.message, 'error');
        }
      }, [onRefresh, showToast]);

      // User clicked "Cancel"
      const handleCancel = useCallback((msgIndex) => {
        dispatch({ type: 'PATCH_MSG', index: msgIndex, patch: { status: 'cancelled' } });
        dispatch({ type: 'ADD_MSG', payload: { role: 'assistant', type: 'text', content: 'No problem, action cancelled.' } });
      }, []);

      const handleSend = useCallback(() => {
        const text = state.chatInput.trim();
        if (!text) return;
        dispatch({ type: 'CHAT_INPUT', payload: '' });
        sendMessage(text);
      }, [state.chatInput, sendMessage]);

      const generateBriefing = useCallback(async () => {
        if (!window.storage.get('settings:endpoint_url') && !window.storage.get('settings:api_key')) {
          showToast('Add a Claude API key or SenseiAI endpoint in Settings first.', 'error');
          return;
        }
        dispatch({ type: 'BRIEFING_OPEN' });
        try {
          const text = await CS.generateMorningBriefing();
          dispatch({ type: 'BRIEFING_SET', payload: text });
          window.storage.set('settings:last_brief_date', DS.todayISO());
        } catch (err) {
          dispatch({ type: 'BRIEFING_SET', payload: null });
          showToast(err.message, 'error');
        }
      }, [showToast]);

      const lockTop3 = useCallback(() => {
        const top3 = DS.tasks.listByPriority().filter(t => !t.completedAt).slice(0, 3);
        window.storage.set('settings:locked_top3', top3.map(t => t.id));
        showToast('Top 3 tasks locked for today.', 'success');
        dispatch({ type: 'BRIEFING_CLOSE' });
      }, [showToast]);

      const generateDigest = useCallback(async () => {
        if (!window.storage.get('settings:endpoint_url') && !window.storage.get('settings:api_key')) { showToast('Add a Claude API key or SenseiAI endpoint in Settings first.', 'error'); return; }

        // Use cached digest if already generated today
        const cachedDate = window.storage.get('settings:digest_date');
        if (cachedDate === DS.todayISO()) {
          const cached = window.storage.get('settings:digest');
          const cachedData = window.storage.get('settings:digest_data');
          if (cached) {
            dispatch({ type: 'DIGEST_OPEN' });
            dispatch({ type: 'DIGEST_SET', payload: { text: cached, data: cachedData } });
            return;
          }
        }

        dispatch({ type: 'DIGEST_OPEN' });
        try {
          const result = await generateEveningDigest();
          dispatch({ type: 'DIGEST_SET', payload: result });
        } catch (err) {
          dispatch({ type: 'DIGEST_LOADING', payload: false });
          showToast(`Digest failed: ${err.message}`, 'error');
          dispatch({ type: 'DIGEST_CLOSE' });
        }
      }, [showToast]);

      const setTomorrow3 = useCallback(() => {
        const dd = state.digestData;
        const candidates = [
          ...(dd?.dlDueTomorrow || []).map(x => ({ title: x.title, source: 'deadline' })),
          ...(dd?.tasksDueTomorrow || []).map(x => ({ title: x.title, source: 'task' })),
          ...(dd?.top3Open || []).map(x => ({ title: x.title, source: 'priority' })),
        ];
        const top3 = candidates.slice(0, 3);
        window.storage.set('settings:locked_top3_tomorrow', top3);
        showToast("Tomorrow's Top 3 set!", 'success');
        dispatch({ type: 'DIGEST_CLOSE' });
      }, [state.digestData, showToast]);

      const runAnalysisCallback = useCallback(async () => {
        if (!window.storage.get('settings:endpoint_url') && !window.storage.get('settings:api_key')) { showToast('Add a Claude API key or SenseiAI endpoint in Settings first.', 'error'); return; }
        dispatch({ type: 'INSIGHTS_LOADING', payload: true });
        try {
          const insights = await runPatternAnalysis();
          dispatch({ type: 'SET_INSIGHTS', payload: insights });
          showToast('Pattern analysis complete!', 'success');
        } catch (err) {
          dispatch({ type: 'INSIGHTS_LOADING', payload: false });
          showToast(`Analysis failed: ${err.message}`, 'error');
        }
      }, [showToast]);

      const sectionProps = { tick: state.tick, onRefresh };

      const renderSection = () => {
        const onNav = s => dispatch({ type: 'NAV', payload: s });
        switch (state.section) {
          case 'dashboard':   return <Dashboard   {...sectionProps} onNav={onNav} onOpenBriefing={generateBriefing}
                                    insights={state.insights} insightsLoading={state.insightsLoading}
                                    onDismissInsight={i => dispatch({ type: 'DISMISS_INSIGHT', index: i })}
                                    onApplyInsight={(ins, i) => { sendMessage(`Help me apply this suggestion: ${ins.suggestion}`); dispatch({ type: 'DISMISS_INSIGHT', index: i }); }}
                                    onRunAnalysis={runAnalysisCallback} />;
          case 'tasks':       return <TasksView   {...sectionProps} />;
          case 'deadlines':   return <DeadlinesView {...sectionProps} />;
          case 'family':      return <FamilyView  {...sectionProps} />;
          case 'habits':      return <HabitsView  {...sectionProps} />;
          case 'medications': return <MedicationsView {...sectionProps} />;
          case 'checklists':  return <ChecklistsView {...sectionProps} />;
          case 'goals':       return <GoalsView      {...sectionProps} />;
          case 'triggers':    return <TriggersView   {...sectionProps}
                                       onTriggerFired={t => dispatch({ type:'ADD_TRIGGER_BANNER', payload: t })} />;
          case 'journal':     return <JournalView    {...sectionProps} />;
          case 'mind':        return <MindView       {...sectionProps} />;
          case 'sensei':      return <SenseiView />;
          case 'vision':      return <VisionBoardView />;
          case 'settings':    return <SettingsView onRunAnalysis={runAnalysisCallback} insightsLoading={state.insightsLoading} onOpenDigest={generateDigest} />;
          default:            return <Dashboard   {...sectionProps} />;
        }
      };

      return (
        <>
          {onboarding && <Onboarding onDone={() => setOnboarding(false)} />}

          <MorningBriefingModal
            open={state.briefingOpen}
            loading={state.briefingLoading}
            briefing={state.briefing}
            onClose={() => dispatch({ type: 'BRIEFING_CLOSE' })}
            onLockTop3={lockTop3}
          />

          <EveningDigestModal
            open={state.digestOpen}
            loading={state.digestLoading}
            digest={state.digest}
            digestData={state.digestData}
            onClose={() => {
              dispatch({ type: 'DIGEST_CLOSE' });
              dispatch({ type: 'DIGEST_BANNER', payload: false });
              window.storage.set('settings:digest_dismissed', DS.todayISO());
            }}
            onSetTomorrow3={setTomorrow3}
          />

          <Toast toast={state.toast} onDismiss={() => dispatch({ type:'TOAST', payload:null })} />

          <div className="flex h-screen overflow-hidden bg-gray-50">
            <Sidebar section={state.section} onNav={s => dispatch({ type:'NAV', payload:s })} open={state.sidebarOpen} />
            <div className="flex flex-col flex-1 min-w-0 overflow-hidden">
              <Header
                section={state.section}
                onToggle={() => dispatch({ type:'TOGGLE_SIDE' })}
                onBrief={generateBriefing}
                thinking={state.thinking}
              />
              {/* Evening digest banner */}
              {state.digestBanner && !state.digestOpen && (
                <div className="mx-4 mt-3 flex items-center gap-3 bg-indigo-950 rounded-xl px-4 py-3 text-sm" style={{ animation: 'slideIn 0.25s ease-out' }}>
                  <span className="text-lg shrink-0">🌙</span>
                  <div className="flex-1 min-w-0">
                    <span className="font-semibold text-white">Evening digest ready</span>
                    <span className="text-indigo-300"> — Andy has reviewed your day</span>
                  </div>
                  <button onClick={generateDigest}
                    className="shrink-0 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
                    View Digest
                  </button>
                  <button onClick={() => {
                    dispatch({ type: 'DIGEST_BANNER', payload: false });
                    window.storage.set('settings:digest_dismissed', DS.todayISO());
                  }} className="shrink-0 text-indigo-400 hover:text-indigo-200 text-lg leading-none">×</button>
                </div>
              )}

              {/* Install app banner */}
              {state.installBanner && !window.matchMedia('(display-mode: standalone)').matches && (
                <div className="mx-4 mt-3 flex items-center gap-3 bg-indigo-600 rounded-xl px-4 py-3 text-sm" style={{animation:'slideIn 0.25s ease-out'}}>
                  <span className="text-xl shrink-0">📲</span>
                  <div className="flex-1 min-w-0">
                    <span className="font-semibold text-white">Install Andy as an app</span>
                    <span className="text-indigo-200"> — works offline, lives on your taskbar</span>
                  </div>
                  <button onClick={async () => {
                    if (window._andyInstallPrompt) {
                      window._andyInstallPrompt.prompt();
                      const { outcome } = await window._andyInstallPrompt.userChoice;
                      window._andyInstallPrompt = null;
                      dispatch({ type: 'SET_INSTALL_BANNER', payload: false });
                    } else {
                      // Prompt already used or dismissed — guide user to browser menu
                      alert('To install:\n\nChrome/Edge → click the ⊕ icon in the address bar\n  — or —\nMenu (⋮) → Cast, Save and Share → Install page as app');
                    }
                  }} className="shrink-0 bg-white text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-indigo-50 transition-colors">
                    Install
                  </button>
                  <button onClick={() => dispatch({ type: 'SET_INSTALL_BANNER', payload: false })}
                    className="shrink-0 text-indigo-300 hover:text-white text-lg leading-none">×</button>
                </div>
              )}

              {/* Seasonal checklist banner */}
              {state.seasonalBanner && (
                <div className="mx-4 mt-3 flex items-center gap-3 bg-emerald-50 border border-emerald-300 rounded-xl px-4 py-3 text-sm" style={{animation:'slideIn 0.25s ease-out'}}>
                  <span className="text-xl shrink-0">{SEASON_META[state.seasonalBanner.season]?.emoji}</span>
                  <div className="flex-1 min-w-0">
                    <span className="font-semibold text-emerald-900 capitalize">{state.seasonalBanner.season} checklist ready</span>
                    <span className="text-emerald-700"> — {state.seasonalBanner.count} item{state.seasonalBanner.count!==1?'s':''} to review</span>
                  </div>
                  <button onClick={() => {
                    window.storage.set(`settings:seasonal_surfaced:${state.seasonalBanner.season}:${state.seasonalBanner.year}`, true);
                    dispatch({ type:'NAV', payload:'checklists' });
                  }} className="shrink-0 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
                    View Checklist
                  </button>
                  <button onClick={() => {
                    window.storage.set(`settings:seasonal_surfaced:${state.seasonalBanner.season}:${state.seasonalBanner.year}`, true);
                    dispatch({ type:'SEASONAL_BANNER', payload:null });
                  }} className="shrink-0 text-emerald-400 hover:text-emerald-600 text-lg leading-none">×</button>
                </div>
              )}

              {/* Trigger fired banners */}
              {state.triggerBanners.map((t, i) => {
                const daysLeft = t.actionDeadline ? DS.daysUntil(t.actionDeadline) : t.actionDeadlineDays || 7;
                return (
                  <div key={i} className="mx-4 mt-3 flex items-center gap-3 bg-amber-50 border border-amber-400 rounded-xl px-4 py-3 text-sm shadow-sm" style={{animation:'slideIn 0.25s ease-out'}}>
                    <span className="text-xl shrink-0">⚡</span>
                    <div className="flex-1 min-w-0">
                      <span className="font-bold text-amber-900">"{t.title}" triggered!</span>
                      {t.triggerResult?.currentValue && (
                        <span className="text-amber-800"> — Current: <span className="font-mono font-semibold">{t.triggerResult.currentValue}</span> meets your threshold.</span>
                      )}
                      <span className="text-amber-700"> You have <span className="font-bold text-red-600">{daysLeft} day{daysLeft!==1?'s':''}</span> to act.</span>
                    </div>
                    <button onClick={() => dispatch({ type:'NAV', payload:'triggers' })}
                      className="shrink-0 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
                      View Details
                    </button>
                    <button onClick={() => dispatch({ type:'DISMISS_TRIGGER_BANNER', index: i })}
                      className="shrink-0 text-amber-400 hover:text-amber-600 text-lg leading-none">×</button>
                  </div>
                );
              })}

              {/* Escalation banners — shown in any section */}
              {state.escalations.map((e, i) => (
                <div key={i} className="mx-4 mt-3 flex items-center gap-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm">
                  <span className="text-lg shrink-0">⚠️</span>
                  <div className="flex-1 min-w-0">
                    <span className="font-semibold text-amber-800">{e.member.name}</span>
                    <span className="text-amber-700"> hasn't completed </span>
                    <span className="font-semibold text-amber-800">"{e.deadline.title}"</span>
                    <span className="text-amber-700"> — due in </span>
                    <span className="font-bold text-red-600">{e.daysLeft < 0 ? `${Math.abs(e.daysLeft)}d overdue` : e.daysLeft === 0 ? 'today' : `${e.daysLeft}d`}</span>
                    <span className="text-amber-700">. Nudge them?</span>
                  </div>
                  <button onClick={() => {
                    DS.activity.log('escalation_sent', `Reminder logged for "${e.deadline.title}" → ${e.member.name}`, { deadlineId: e.deadline.id, memberId: e.member.id });
                    dispatch({ type: 'DISMISS_ESCALATION', index: i });
                    dispatch({ type: 'TOAST', payload: { text: 'Reminder logged', variant: 'success' } });
                  }} className="shrink-0 bg-amber-600 hover:bg-amber-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition-colors">
                    Send Reminder
                  </button>
                  <button onClick={() => dispatch({ type: 'DISMISS_ESCALATION', index: i })}
                    className="shrink-0 text-amber-400 hover:text-amber-600 text-lg leading-none">×</button>
                </div>
              ))}
              <main className="flex-1 overflow-y-auto">
                {renderSection()}
              </main>
              <ChatPanel
                messages={state.messages}
                input={state.chatInput}
                onChange={v => dispatch({ type:'CHAT_INPUT', payload:v })}
                onSend={handleSend}
                onConfirm={handleConfirm}
                onCancel={handleCancel}
                thinking={state.thinking}
              />
            </div>
          </div>
        </>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(e) { return { err: e }; }
      render() {
        if (this.state.err) return (
          <div style={{ padding:24, fontFamily:'monospace', color:'#dc2626', background:'#fef2f2', minHeight:'100vh' }}>
            <strong>Andy crashed</strong><br /><br />
            {this.state.err.message}<br /><br />
            <pre style={{ whiteSpace:'pre-wrap', fontSize:11 }}>{this.state.err.stack}</pre>
          </div>
        );
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary><App /></ErrorBoundary>
    );
  </script>
</body>
</html>
